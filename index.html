<body>
<div class="wrap">
<aside class="spine" aria-hidden="true"><span>GESCHICHTE · VERGANGENHEIT · DARSTELLUNG</span></aside>
<header><h1>Klausurvorbereitung Geschichte</h1><p class="subtitle">Was ist Geschichte? · Geschichtsbilder · Völkerwanderung · historisches Urteilen</p></header>
<div class="topline"><progress id="progress" max="100" value="0" aria-label="Fortschritt"></progress><label id="progressText" for="progress">Fortschritt: 0 %</label></div>
<nav class="nav" aria-label="Navigation"><button data-view="home">Themen</button><button data-view="summary">Dein Lernstand</button><a class="button quiet" href="https://denkwerk-kronwerk.vercel.app/" target="_blank" rel="noopener noreferrer">Denkwerk ↗</a></nav>
<main id="main" tabindex="-1"></main>
<footer class="footer"><span>Geschichte · E-Jahrgang</span><button id="reset" class="quiet">Fortschritt zurücksetzen</button></footer>
<div id="resetbox" class="resetbox" hidden><p>Alle Antworten und den Lernstand zurücksetzen?</p><div class="actions"><button id="confirmReset">Zurücksetzen</button><button id="cancelReset" class="secondary">Abbrechen</button></div></div>
<p id="savewarn" class="savewarn" role="status" hidden>Dein Fortschritt kann gerade nicht gespeichert werden.</p>
</div>
<script>
'use strict';
const PDF='https://denkwerk-kronwerk.vercel.app/lernzettel/geschichte-aussage-beurteilen.pdf';
const areas=['Quellen & Darstellungen','Perspektivität','Geschichtsbilder','Völkerwanderung','Westrom','Herausarbeiten','Erläutern','Beurteilen'];
const topics=[
{title:'Vergangenheit – Quelle – Darstellung',desc:'Zeugnisse zuordnen. Grenzfälle begründen.',recap:['Vergangenheit umfasst tatsächliche vergangene Ereignisse. Sie ist nicht unmittelbar zugänglich.','Quellen sind Überreste oder Zeugnisse der Vergangenheit. Ihr Erkenntniswert hängt von der Frage ab.','Darstellungen entstehen später durch Auswahl, Ordnung und Deutung.','Dasselbe Material kann je nach Fragestellung Quelle oder Darstellung sein.']},
{title:'Historische Darstellungen',desc:'Auswahl, Perspektive und Wirkung vergleichen.',recap:['Darstellungen wählen aus, gewichten, deuten und lassen aus.','Perspektiven hängen unter anderem von Fragestellung, Standort und Entstehungszeit ab.','Unterschiedliche Perspektiven sind nicht automatisch falsch. Aussagen müssen sich an Belegen prüfen lassen.']},
{title:'Quellen prüfen',desc:'Aussagewert und Grenzen bestimmen.',recap:['Frage nach Verfasser, Zeitpunkt, Adressat und Absicht.','Unterscheide Beobachtung, Behauptung und Wertung.','Prüfe Perspektive, Aussagewert und Grenzen anhand der konkreten Fragestellung.','Einseitige Quellen sind nicht wertlos: Sie können Einstellungen und Interessen zeigen.']},
{title:'Geschichtsbilder & Geschichtskultur',desc:'Inszenierungen und Gegenwartsbezüge untersuchen.',recap:['Geschichtsbilder verdichten Vorstellungen von Vergangenheit.','Filme, Memes, Denkmäler und digitale Bilder gehören zur Geschichtskultur.','Auswahl und Inszenierung können gegenwärtige Interessen ausdrücken.','Überzeugungskraft beruht auch auf Quellenbezug, Kontext und Überprüfbarkeit.']},
{title:'Die sogenannte „Völkerwanderung“',desc:'Begriffe prüfen. Wandelbare Verbände verstehen.',recap:['„Völkerwanderung“ ist ein problematischer Sammelbegriff für unterschiedliche Vorgänge der Spätantike.','Es wanderten keine unveränderlichen, homogenen und geschlossenen „Völker“. Verbände konnten sich neu bilden und verändern.','Migration, Flucht, militärische Bewegung und Ansiedlung sind zu unterscheiden.','Rom und zugewanderte Gruppen kooperierten und gerieten in Konflikt; Integration verlief unterschiedlich.']},
{title:'Ende des Weströmischen Reiches',desc:'Faktoren verknüpfen. Entwicklungen erklären.',recap:['Adrianopel 378 betraf das oströmische Heer; Rom 410 war ein schwerer symbolischer und politischer Einschnitt. Beide Ereignisse erklären Westroms Ende nicht allein.','Gebietsverluste, sinkende Steuereinnahmen und Rekrutierungsprobleme konnten einander verstärken.','Schwache Kaiser, mächtige Heermeister, Bürgerkriege und politische Konkurrenz erschwerten die Stabilisierung.','Föderaten waren vertraglich gebundene Gruppen, die militärische Dienste leisteten. Kooperation und Konflikt wechselten.','476 endete das weströmische Kaisertum; römische Strukturen bestanden weiter. Es gibt keine hier vorgegebene Hauptursache.']},
{title:'Operatoren',desc:'Textaussagen erkennen. Argumente prüfen.',recap:['Herausarbeiten: zentrale Position und Begründungen textnah wiedergeben; keine eigene Meinung.','Erläutern: Material durch Fachwissen verständlich machen und Zusammenhänge erklären.','Beurteilen: Aussage klären, Teilaussagen prüfen, Argumente belegen, gewichten und ein Sachurteil formulieren.']},
{title:'Gemischte Wiederholung',desc:'Sechs Fälle. Begriffe und Belege verbinden.',recap:['Nutze Fachbegriffe präzise und beziehe dich auf das Material.','Unterscheide unterschiedliche Perspektiven von unbelegten oder widerlegten Behauptungen.','Begründe Einordnungen; prüfe Aussagewert und Grenzen.']}
];
const tasks=[];
const mat=(text,credit='')=>`<div class="material"><p>${text}</p>${credit?`<small>${credit}</small>`:''}</div>`;
const pair=(a,b)=>`<div class="compare">${mat(a,'Darstellung A')}${mat(b,'Darstellung B')}</div>`;
function add(t,a,type,title,body,data,hints){tasks.push({id:'r2-'+t+'-'+tasks.filter(q=>q.t===t).length,t,a,type,title,body,...data,hints})}
function match(t,a,title,body,opts,rows,hints,type='sort'){add(t,a,type,title,body,{opts,rows},hints)}
function choice(t,a,title,body,opts,correct,explain,hints){add(t,a,'choice',title,body,{opts,correct,explain},hints)}
function multi(t,a,title,body,opts,correct,explain,hints){add(t,a,'multi',title,body,{opts,correct,explain},hints)}
function free(t,a,title,body,criteria,hints){add(t,a,'free',title,body,{criteria},hints)}
const sourceHints=['Unterscheide das Geschehen von einem erhaltenen Zeugnis und einer späteren Deutung.','Entscheidend ist, auf welche Zeit und welche Frage sich die Untersuchung richtet.','Ein Gegenstand kann für verschiedene Fragen einen unterschiedlichen Erkenntniswert besitzen.'];
const perspectiveHints=['Achte auf die Fragestellung und den Standort.','Vergleiche verwendete Begriffe, Belege und ausgelassene Aspekte.','Unterschiedliche Schwerpunkte können legitim sein; die einzelnen Aussagen bleiben überprüfbar.'];
const evidenceHints=['Trenne eine Behauptung von ihrem Nachweis.','Frage, wer etwas wahrnimmt, behauptet oder erreichen will.','Eine Aussage über einen Verfasser belegt noch keine Haltung der gesamten Gesellschaft.'];
const argumentHints=['Prüfe, ob die Begründung die konkrete Behauptung stützt.','Ein Beleg muss sachlich passen; seine Bedeutung muss erklärt werden.','Begrenze die Folgerung auf das, was Material und Fachwissen tatsächlich tragen.'];
match(0,0,'Begriffe verbinden','Verbinde jeden Begriff mit der passenden Definition.',['tatsächliches vergangenes Geschehen','erhaltenes Zeugnis, aus dem Wissen über Vergangenheit gewonnen wird','spätere Auswahl, Ordnung und Deutung von Vergangenheit'],[['Vergangenheit',0,'Vergangenheit ist das Geschehen selbst.'],['Quelle',1,'Quellen ermöglichen einen vermittelten Zugang zum Geschehen.'],['Darstellung',2,'Darstellungen ordnen und deuten auf einer Materialgrundlage.']],sourceHints,'connect');
match(0,0,'Zeugnisse zuordnen','Ordne nach der jeweils genannten Untersuchungsfrage.',['Vergangenheit','Quelle','Darstellung'],[
['Brief von 1916: Wie nahm ein Soldat den Krieg wahr?',1,'Der Brief bezeugt eine zeitgenössische Wahrnehmung.'],['Römische Münze: Wie stellte ein Kaiser seine Herrschaft dar?',1,'Die Münze ist ein materieller Überrest kaiserlicher Selbstdarstellung.'],['Tagebuch von 1945: Wie erlebte eine Person ihren Alltag?',1,'Das Tagebuch überliefert eine persönliche Perspektive.'],['Heutiger Dokumentarfilm: Wie wird der Erste Weltkrieg erklärt?',2,'Der spätere Film wählt aus, ordnet und deutet.'],['Heutiger Schulbuchtext: Wie wird die römische Republik erklärt?',2,'Der Schulbuchtext ist eine spätere Darstellung.'],['Karte von 2024: Wie werden spätantike Wanderungen rekonstruiert?',2,'Die spätere Rekonstruktion enthält Auswahl und Deutung.'],['Der tatsächliche Ausbruch des Vesuvs im Jahr 79',0,'Das Ereignis selbst ist vom späteren Wissen darüber zu unterscheiden.'],['Spielfilm von 1960: Wie erzählt er den Zweiten Weltkrieg?',2,'Bezogen auf den erzählten Krieg ist der Film eine spätere Darstellung.'],['Denkmal von 1890: Welches Geschichtsbild vertraten die Auftraggeber?',1,'Für die Erinnerungskultur von 1890 ist das Denkmal eine Quelle.'],['Archäologischer Keramikfund: Welche Gefäße wurden damals verwendet?',1,'Der Fund ist ein materieller Überrest; sein Kontext ist zu prüfen.']],sourceHints);
free(0,0,'Quelle, Darstellung oder beides? Begründe.',mat('Ein Spielfilm von 1960 erzählt vom Zweiten Weltkrieg.')+'Unterscheide zwei Untersuchungsfragen. Begründe in 1–2 Sätzen.',['Ich unterscheide die erzählte Kriegszeit von der Entstehungszeit 1960.','Ich benenne den Darstellungscharakter für den Krieg.','Ich benenne den Quellenwert für die Geschichtskultur von 1960.'],sourceHints);
free(0,0,'Eine historische Karte – ein eindeutiger Fall?',mat('Eine im Jahr 1812 gedruckte Karte zeigt die damaligen Grenzen Europas.')+'Erkläre in 2–3 Sätzen den Erkenntniswert für damalige Raumvorstellungen und eine Grenze.',['Ich ordne die Karte mit Bezug auf die Untersuchungsfrage ein.','Ich berücksichtige Auswahl oder Perspektive des Kartenherstellers.','Ich unterscheide damalige Grenzdarstellung und tatsächliche Verhältnisse.'],['Auch Karten beruhen auf Entscheidungen.','Frage nach Auftrag, Zweck und dargestelltem Raum.','Beziehe Grenzen, Auslassungen und den Entstehungszeitpunkt ein.']);
choice(0,0,'Ein Denkmal – zwei Fragen',mat('Ein Denkmal von 1890 erinnert an einen Krieg von 1870/71.')+'Welche Einordnung ist am genauesten?',['Es ist Vergangenheit, weil der Stein alt ist.','Es ist Darstellung des Krieges und Quelle für die Erinnerungskultur von 1890.','Es ist ausschließlich eine Quelle für den genauen Verlauf jeder Schlacht.'],1,'Der Erkenntniswert hängt von der Frage ab; Erinnerung und Geschehen fallen nicht zusammen.',sourceHints);
const romA='Als Alarichs Truppen im August 410 in Rom eindrangen, geriet der Alltag der Stadtbevölkerung aus den Fugen. Häuser wurden geplündert, Bewohner verloren Besitz, viele suchten Schutz oder flohen. Für Menschen, die Rom als Mittelpunkt einer unerschütterlichen Ordnung verstanden hatten, war die Einnahme ein schwerer Schock. Zeitgenössische Berichte geben Angst und Empörung wieder, unterscheiden sich aber in ihren Angaben zum Ausmaß der Gewalt. Der Blick auf die Betroffenen macht deutlich, dass politische und militärische Konflikte weit über die Führungsschichten hinauswirkten. Die Plünderung dauerte nur wenige Tage; Verluste, Unsicherheit und die Erinnerung an die Verletzlichkeit der Stadt blieben für viele länger bestehen.';
const romB='Die Plünderung Roms im Jahr 410 war ein aufsehenerregender Einschnitt, bedeutete jedoch nicht das sofortige Ende des weströmischen Reiches. Die kaiserliche Regierung hatte ihren Sitz bereits in Ravenna. Verwaltung, Steuererhebung und militärische Organisation bestanden in verschiedenen Regionen weiter. Alarichs Vorgehen stand zudem im Zusammenhang mit gescheiterten Verhandlungen über Versorgung, Stellung und Ansiedlung seines Verbandes. Wer das Ereignis allein als Zusammenstoß zweier geschlossener Völker beschreibt, übersieht politische Aushandlungen und wechselnde Bündnisse. Für die weitere Entwicklung waren längerfristige Machtkämpfe, territoriale Verluste und finanzielle Probleme bedeutsam. Die Einnahme der Stadt zeigt damit eine schwere Krise imperialer Autorität, aber keinen vollständigen Zusammenbruch sämtlicher römischer Strukturen.';

const expertText='Spätantike Migration lässt sich nicht angemessen als geradliniger Zug unveränderlicher Völker beschreiben. Vielmehr müssen die Bildung von Verbänden und ihre Beziehungen zur römischen Herrschaft gemeinsam untersucht werden. Erstens veränderte sich die Zusammensetzung solcher Gruppen: Neue Mitglieder wurden aufgenommen, andere trennten sich ab, und die Bindung an Anführer konnte wechseln. Ein Verband war deshalb keine dauerhaft geschlossene Abstammungsgemeinschaft. Zweitens bestimmten unterschiedliche Beziehungen zu Rom die Handlungsmöglichkeiten. Verträge, Heeresdienst und Ansiedlung standen neben militärischen Konflikten und gescheiterten Verhandlungen. Die Aufnahme eines Verbandes in römische Dienste konnte etwa Versorgung ermöglichen, zugleich aber neue Abhängigkeiten schaffen. Dieses Beispiel verdeutlicht die Verbindung von Bewegung und politischer Aushandlung. Wer nur Wanderungswege auf einer Karte verfolgt, erfasst daher weder den Wandel der Beteiligten noch die wechselnden Bedingungen ihres Handelns. Eine tragfähige Untersuchung verbindet konkrete Akteure, Interessen und Situationen.';

choice(6,5,'Welche Schülerantwort arbeitet heraus?',mat('Auftrag: Arbeite die zentrale Position und zwei Begründungen heraus.')+'Vergleiche die Antworten zum Fachtext.',['„Es geht um Migration und Rom. Der Text enthält verschiedene Beispiele und erwähnt Karten.“','„Der Text erklärt Migration aus dem Wandel der Verbände und ihren Beziehungen zu Rom. Er begründet dies erstens mit Aufnahme und Abspaltung, zweitens mit wechselnder Kooperation und Konflikten.“','„Ich finde, Karten sind der beste Zugang. Der Autor müsste viel mehr Jahreszahlen nennen.“'],1,'Eine Herausarbeitung verbindet Position und textnahe Begründungen; Themenliste und eigene Meinung leisten das nicht.',argumentHints);

choice(6,7,'Die Leitfrage treffen',mat('Leitfrage: „Wie aussagekräftig ist eine Rede für die politischen Interessen ihres Verfassers?“')+'Welche Argumentation beantwortet die Frage?',['Die Rede entstand in einer wirtschaftlichen Krise; Krisen sind historisch interessant.','Der Redner fordert die Zustimmung zu einem Antrag und bevorzugt ausdrücklich eine Gruppe. Das macht sein politisches Ziel erkennbar, belegt aber keine allgemeine Zustimmung.','Der Redner schrieb lange Sätze; sein Lebenslauf wäre deshalb wichtiger als der Inhalt.'],1,'Die Argumentation prüft den Aussagewert genau für die genannten Interessen und grenzt ihn ein.',argumentHints);

const KEY='geschichte-e-lernstand-v1',main=document.querySelector('#main');
let state={answers:{},results:{},hints:{},positions:{}},view='home',selected=null,dragged=null;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'&&s.answers&&s.results&&s.hints)state=s}catch(e){}
state.positions??={};
if(state.revision!==2){for(const [old,title] of [['q2','Eine historische Karte – ein eindeutiger Fall?'],['q5','Wie entsteht eine Darstellung?'],['q15','Vorgänge unterscheiden'],['q24','Welcher Beleg trägt?'],['q25','Welches Sachurteil ist stärker?']]){const q=tasks.find(q=>q.title===title);if(state.answers[old])state.answers[q.id]=state.answers[old];if(state.results[old])state.results[q.id]=state.results[old];if(state.hints[old])state.hints[q.id]=state.hints[old]}state.revision=2}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const answer=q=>state.answers[q.id]||{};
const equal=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.querySelector('#savewarn').hidden=true}catch(e){document.querySelector('#savewarn').hidden=false}}
function done(q){return Object.hasOwn(state.results,q.id)}
function updateProgress(){const p=Math.round(tasks.filter(done).length/tasks.length*100);document.querySelector('#progress').value=p;document.querySelector('#progressText').textContent=`Fortschritt: ${p} %`;const label=main.querySelector('.tasknav>span');if(label){const qs=tasks.filter(q=>q.t===Number(view)),n=state.positions[view];label.textContent=`Aufgabe ${n+1} / ${qs.length}${done(qs[n])?' · bearbeitet':''}`}}
function links(){return `<aside class="denkwerk"><h3>Urteil ausführlich üben</h3><p>Schreibe deine eigene Beurteilung im Denkwerk.</p><div class="actions"><a class="button" href="https://denkwerk-kronwerk.vercel.app/" target="_blank" rel="noopener noreferrer">Denkwerk öffnen ↗</a><a class="button secondary" href="${PDF}" target="_blank" rel="noopener noreferrer">Denkzettel ansehen ↗</a></div></aside>`}
function home(){return `<p class="intro">Wähle ein Thema aus.</p><div class="grid">${topics.map((t,i)=>{const qs=tasks.filter(q=>q.t===i),n=qs.filter(done).length;return `<button class="topic" data-view="${i}"><span class="num">Thema ${String(i+1).padStart(2,'0')}</span><h3>${t.title}</h3><span class="desc">${t.desc}</span><span class="foot"><span>${n} / ${qs.length} bearbeitet</span><b aria-hidden="true">↗</b></span></button>`}).join('')}</div>`}
function summary(){const rated=tasks.filter(done);return `<h2>Dein Lernstand</h2>${rated.length?'<p>Nach deinen Antworten und Kriterienprüfungen.</p>':'<p class="empty">Bearbeite eine Aufgabe, um deinen Lernstand einzusehen.</p>'}${areas.map((a,i)=>{const qs=rated.filter(q=>q.a===i);if(!qs.length)return `<div class="statusrow"><span>${a}</span><span class="unrated">noch nicht bearbeitet</span></div>`;const score=qs.reduce((s,q)=>s+state.results[q.id].score,0)/qs.length;return `<div class="statusrow"><span>${a}<br><small class="micro">${qs.length} / ${tasks.filter(q=>q.a===i).length} bearbeitet</small></span><span class="pill ${score<.6?'warn':''}">${score>=.85?'sicher':score>=.6?'weitgehend sicher':'noch üben'}</span></div>`}).join('')}${links()}<div class="actions"><button data-view="home">Wähle ein Thema.</button></div>`}
function cards(q){const a=answer(q),source=(r,i)=>`<button type="button" draggable="true" data-source="${i}" aria-pressed="${selected===i}" class="source ${selected===i?'selected':''}">${r[0]}${q.type==='connect'&&a[i]!==undefined?`<span class="assigned">→ ${q.opts[a[i]]}</span>`:''}</button>`;if(q.type==='connect')return `<p class="controlnote">Wähle einen Begriff und die passende Definition. Oder ziehe die Karte.</p><div class="connections"><div>${q.rows.map(source).join('')}</div><div>${q.opts.map((s,j)=>({s,j})).sort((a,b)=>(a.j+1)%q.opts.length-(b.j+1)%q.opts.length).map(({s,j})=>`<button class="target" data-target="${j}">${s}</button>`).join('')}</div></div>`;return `<p class="controlnote">Wähle eine Karte und ein Feld. Oder ziehe die Karte.</p><div class="cardpool">${q.rows.map((r,i)=>a[i]===undefined?source(r,i):'').join('')||'<p>Alle Karten sind zugeordnet.</p>'}</div><div class="bins" style="--cols:${Math.min(3,q.opts.length)}">${q.opts.map((s,j)=>`<section class="bin" data-drop="${j}"><button class="target" data-target="${j}">${s}</button>${q.rows.map((r,i)=>a[i]===String(j)?source(r,i):'').join('')}</section>`).join('')}</div>`}
function controls(q){const a=answer(q);if(q.type==='choice'||q.type==='multi')return `<fieldset><legend class="controlnote">${q.type==='multi'?'Markiere alle passenden Aussagen.':'Wähle eine Antwort.'}</legend>${q.opts.map((x,i)=>`<label class="option"><input type="${q.type==='multi'?'checkbox':'radio'}" name="${q.id}" data-answer="${q.type==='multi'?'picks':'pick'}" value="${i}" ${q.type==='multi'?(a.picks||[]).includes(i)?'checked':'':a.pick===String(i)?'checked':''}><span>${x}</span></label>`).join('')}</fieldset>`;
if(q.type==='sort'||q.type==='connect')return cards(q);
if(q.type==='network')return q.rows.map((r,i)=>`<fieldset class="networkrow"><legend>${r[0]} →</legend>${q.opts.map((x,j)=>`<label class="option"><input type="checkbox" data-edge="${i}" value="${j}" ${(a['edge'+i]||[]).includes(j)?'checked':''}><span>${x}</span></label>`).join('')}</fieldset>`).join('');
if(q.type==='rubric')return q.rows.map((r,i)=>`<fieldset class="rubricrow"><legend>Erklärung ${i+1}</legend>${mat(r[0])}<label for="${q.id}-rating${i}">Bewertung</label><select id="${q.id}-rating${i}" data-answer="rating${i}"><option value="">Wählen …</option>${q.opts.map((s,j)=>`<option value="${j}" ${a['rating'+i]===String(j)?'selected':''}>${s}</option>`).join('')}</select><p class="controlnote">Welche Kriterien erfüllt der Wortlaut?</p>${q.criteria.map((c,j)=>`<label class="option"><input type="checkbox" data-rubric="${i}" value="${j}" ${(a['rubric'+i]||[]).includes(j)?'checked':''}><span>${c}</span></label>`).join('')}</fieldset>`).join('');
if(q.type==='order')return `<p class="controlnote">Bringe die Karten in die passende Reihenfolge. Ziehe sie oder nutze die Pfeile.</p><div class="orderlist">${(a.order||q.cards.map((x,i)=>i)).map((j,i)=>`<div class="ordercard" draggable="true" data-order="${j}" data-slot="${i}"><span class="ordinal">${i+1}</span><span>${q.cards[j]}</span><div class="move"><button class="secondary" data-move="${i}" data-delta="-1" aria-label="Karte ${i+1} nach oben" ${i===0?'disabled':''}>↑</button><button class="secondary" data-move="${i}" data-delta="1" aria-label="Karte ${i+1} nach unten" ${i===q.cards.length-1?'disabled':''}>↓</button></div></div>`).join('')}</div>`;
return `<label class="controlnote" for="${q.id}-text">Kurze Begründung · 1–3 Sätze</label><textarea id="${q.id}-text" data-answer="text" maxlength="450" rows="3" placeholder="Begründe mit Material und Fachwissen.">${esc(a.text||'')}</textarea>`}
function review(q){const a=answer(q);return `<div class="review" ${!a.open?'hidden':''}><h3>Kriterien prüfen</h3><p>Vergleiche die Begründung mit den Kriterien. Markiere, was du erfüllt hast.</p>${q.criteria.map((c,i)=>`<label class="option"><input type="checkbox" data-criterion="${i}" ${a.criteria?.includes(i)?'checked':''}><span>${c}</span></label>`).join('')}<button data-action="assess">Rückmeldung übernehmen</button></div>`}
function scoreParts(q){const a=answer(q);if(q.type==='choice')return [Number(Number(a.pick)===q.correct)];if(q.type==='multi')return [Number(equal(a.picks||[],q.correct))];if(q.type==='sort'||q.type==='connect')return q.rows.map((r,i)=>Number(Number(a[i])===r[1]));if(q.type==='order')return [Number(equalOrder(a.order||q.cards.map((x,i)=>i),q.correct))];if(q.type==='network')return q.rows.map((r,i)=>{const picked=a['edge'+i]||[];return picked.length?picked.filter(x=>r[1].includes(x)).length/picked.length:0});if(q.type==='rubric')return q.rows.map((r,i)=>(Number(Number(a['rating'+i])===r[1])+Number(equal(a['rubric'+i]||[],r[2])))/2);return [(a.criteria||[]).length/q.criteria.length]}
function equalOrder(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i])}
function feedback(q){if(!done(q))return '';const a=answer(q),r=state.results[q.id],parts=scoreParts(q),line=(good,text)=>`<li class="${good?'good':'warn'}">${good?'✓':'△'} ${good?'Richtig.':'Noch prüfen.'} ${text}</li>`;if(q.type==='free')return `<p><strong>Kriterienprüfung</strong></p><ul>${q.criteria.map((c,i)=>`<li class="${a.criteria?.includes(i)?'good':'warn'}">${a.criteria?.includes(i)?'✓':'△'} ${c}${a.criteria?.includes(i)?'':' – noch prüfen'}</li>`).join('')}</ul>`;if(['choice','order'].includes(q.type))return `<p class="${r.score===1?'good':'warn'}"><strong>${r.score===1?'✓ Richtig.':'△ Noch nicht richtig.'}</strong> ${q.explain}</p>`;if(q.type==='multi')return `<ul>${q.opts.map((x,i)=>line((a.picks||[]).includes(i)===q.correct.includes(i),x+(q.correct.includes(i)?' – passt.':' – passt nicht.'))).join('')}</ul><p>${q.explain}</p>`;return `<ul>${q.rows.map((row,i)=>line(parts[i]===1,row[0]+'<br>'+row[q.type==='rubric'?3:2])).join('')}</ul>`}
function exercise(q,n){const h=Math.min(3,state.hints[q.id]||0);return `<article class="exercise" id="${q.id}" data-id="${q.id}"><h3>${q.title}</h3>${q.body}<div class="interaction">${controls(q)}</div><div class="actions"><button data-action="check">Prüfen</button><button class="secondary" data-action="hint" ${h===3?'disabled':''}>Hinweis${h?' · '+h+'/3':''}</button><button class="quiet" data-action="retry" ${done(q)?'':'hidden'}>Noch einmal versuchen</button></div><div class="hint" ${h?'':'hidden'}><span class="micro">${['','Denkanstoß','Konkreter Hinweis','Mögliche Aspekte'][h]}</span><p>${h?q.hints[h-1]:''}</p></div>${q.type==='free'?review(q):''}<div class="feedback" role="status" ${done(q)?'':'hidden'}>${feedback(q)}</div></article>`}
function topic(i){const t=topics[i],qs=tasks.filter(q=>q.t===i),n=Math.max(0,Math.min(qs.length-1,Number(state.positions[i])||0));state.positions[i]=n;return `<div class="sectionhead"><h2>${t.title}</h2><span class="count">Thema ${i+1} / 8</span></div><details class="recap"><summary>Wiederholen</summary><ul>${t.recap.map(x=>`<li>${x}</li>`).join('')}</ul></details><div class="tasknav"><span>Aufgabe ${n+1} / ${qs.length}${done(qs[n])?' · bearbeitet':''}</span><label>Aufgabe wählen<select id="taskSelect" aria-label="Aufgabe wählen">${qs.map((q,j)=>`<option value="${j}" ${n===j?'selected':''}>${j+1}. ${q.title}</option>`).join('')}</select></label></div>${exercise(qs[n],n)}${i===6&&n===qs.length-1?links():''}<div class="endnav"><button class="secondary" data-step="-1" ${n===0?'disabled':''}>Zurück</button><button class="secondary" data-view="home">Themenübersicht</button>${n<qs.length-1?'<button data-step="1">Weiter</button>':`<button data-view="${i===7?'summary':i+1}">${i===7?'Dein Lernstand':'Nächstes Thema'}</button>`}</div>`}
function show(v,focus=true){view=v;selected=null;dragged=null;main.innerHTML=v==='home'?home():v==='summary'?summary():topic(Number(v));document.querySelectorAll('nav [data-view]').forEach(el=>el.setAttribute('aria-current',el.dataset.view===String(v)?'page':'false'));updateProgress();if(focus){main.focus({preventScroll:true});main.scrollIntoView({behavior:'instant',block:'start'})}}
function invalidate(q,el){delete state.results[q.id];if(q.type==='free'){answer(q).open=false;el.querySelector('.review').hidden=true}el.querySelector('.feedback').hidden=true;el.querySelector('[data-action=retry]').hidden=true;save();updateProgress()}
function context(el){const card=el.closest('[data-id]');return {el:card,q:card?tasks.find(q=>q.id===card.dataset.id):null}}
function refreshControls(q,el){el.querySelector('.interaction').innerHTML=controls(q)}
function assign(q,el,source,target){state.answers[q.id]??={};state.answers[q.id][source]=String(target);selected=null;invalidate(q,el);refreshControls(q,el)}
function move(q,el,from,to){if(from===to)return;const order=[...(answer(q).order||q.cards.map((x,i)=>i))];const [item]=order.splice(from,1);order.splice(to,0,item);state.answers[q.id]??={};state.answers[q.id].order=order;invalidate(q,el);refreshControls(q,el);el.querySelector(`[data-move="${to}"]`)?.focus()}
main.addEventListener('input',e=>{const {el,q}=context(e.target);if(!q)return;state.answers[q.id]??={};const a=answer(q),ds=e.target.dataset;if(ds.criterion!==undefined){a.criteria=Array.from(el.querySelectorAll('[data-criterion]:checked'),x=>Number(x.dataset.criterion));delete state.results[q.id];el.querySelector('.feedback').hidden=true;save();updateProgress();return}if(ds.edge!==undefined||ds.rubric!==undefined){const type=ds.edge!==undefined?'edge':'rubric',index=ds[type];a[type+index]=Array.from(el.querySelectorAll(`[data-${type}="${index}"]:checked`),x=>Number(x.value))}else if(ds.answer==='picks')a.picks=Array.from(el.querySelectorAll('[data-answer=picks]:checked'),x=>Number(x.value));else if(ds.answer!==undefined)a[ds.answer]=e.target.value;else return;invalidate(q,el)});
main.addEventListener('change',e=>{if(e.target.id==='taskSelect'){state.positions[view]=Number(e.target.value);save();show(view)}});
main.addEventListener('dragstart',e=>{const src=e.target.closest('[data-source],[data-order]');if(!src)return;const {q}=context(src);dragged={id:q.id,index:src.dataset.source!==undefined?Number(src.dataset.source):Number(src.dataset.order),order:src.dataset.order!==undefined};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragged.index))});
main.addEventListener('dragover',e=>{if(e.target.closest('[data-target],[data-drop],[data-slot]'))e.preventDefault()});
main.addEventListener('drop',e=>{const dest=e.target.closest('[data-target],[data-drop],[data-slot]');if(!dest||!dragged)return;e.preventDefault();const {el,q}=context(dest);if(!q||dragged.id!==q.id)return;if(dragged.order){const order=answer(q).order||q.cards.map((x,i)=>i);move(q,el,order.indexOf(dragged.index),Number(dest.dataset.slot))}else assign(q,el,dragged.index,Number(dest.dataset.target??dest.dataset.drop));dragged=null});
main.addEventListener('dragend',()=>dragged=null);
function missing(q){const a=answer(q);if(q.type==='free')return !a.text?.trim();if(q.type==='choice')return a.pick===undefined;if(q.type==='multi')return !a.picks?.length;if(q.type==='sort'||q.type==='connect')return q.rows.some((r,i)=>a[i]===undefined);if(q.type==='network')return q.rows.some((r,i)=>!a['edge'+i]?.length);if(q.type==='rubric')return q.rows.some((r,i)=>a['rating'+i]===undefined||a['rating'+i]===''||!a['rubric'+i]?.length);return false}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){show(nav.dataset.view);return}const step=e.target.closest('[data-step]');if(step){state.positions[view]+=Number(step.dataset.step);save();show(view);return}const {el,q}=context(e.target);if(!q)return;const src=e.target.closest('[data-source]');if(src){selected=Number(src.dataset.source);refreshControls(q,el);el.querySelector(`[data-source="${selected}"]`)?.focus();return}const target=e.target.closest('[data-target]');if(target){if(selected===null){el.querySelector('.feedback').hidden=false;el.querySelector('.feedback').textContent='Wähle zuerst eine Karte.'}else assign(q,el,selected,Number(target.dataset.target));return}const mv=e.target.closest('[data-move]');if(mv){move(q,el,Number(mv.dataset.move),Number(mv.dataset.move)+Number(mv.dataset.delta));return}const btn=e.target.closest('[data-action]');if(!btn)return;const a=answer(q),act=btn.dataset.action,fb=el.querySelector('.feedback');if(act==='hint'){const h=Math.min(3,(state.hints[q.id]||0)+1);state.hints[q.id]=h;el.querySelector('.hint').hidden=false;el.querySelector('.hint').innerHTML=`<span class="micro">${['','Denkanstoß','Konkreter Hinweis','Mögliche Aspekte'][h]}</span><p>${q.hints[h-1]}</p>`;btn.textContent=`Hinweis · ${h}/3`;btn.disabled=h===3;save();return}if(act==='retry'){delete state.results[q.id];delete state.answers[q.id];selected=null;save();el.outerHTML=exercise(q,state.positions[view]);updateProgress();return}if(act==='check'){if(missing(q)){fb.hidden=false;fb.textContent=q.type==='free'?'Formuliere eine kurze Begründung.':'Vervollständige zuerst die Zuordnung oder Auswahl.';return}if(q.type==='free'){a.open=true;el.querySelector('.review').hidden=false;fb.hidden=true;save();return}}if(act==='assess'&&!a.text?.trim())return;if(act==='check'||act==='assess'){const parts=scoreParts(q);state.results[q.id]={score:parts.reduce((s,x)=>s+x,0)/parts.length};fb.innerHTML=feedback(q);fb.hidden=false;el.querySelector('[data-action=retry]').hidden=false;save();updateProgress()}});
document.querySelector('#reset').onclick=()=>{const box=document.querySelector('#resetbox');box.hidden=false;document.querySelector('#cancelReset').focus();box.scrollIntoView({block:'nearest'})};
document.querySelector('#cancelReset').onclick=()=>{document.querySelector('#resetbox').hidden=true;document.querySelector('#reset').focus()};
document.querySelector('#confirmReset').onclick=()=>{state={answers:{},results:{},hints:{},positions:{},revision:2};try{localStorage.removeItem(KEY)}catch(e){}document.querySelector('#resetbox').hidden=true;show('home')};
show('home',false);

</script>
</body>
</html>
