const topics=[
{title:'Vergangenheit – Quelle – Darstellung',desc:'Zeugnisse zuordnen. Grenzfälle begründen.',recap:['Vergangenheit umfasst tatsächliche vergangene Ereignisse. Sie ist nicht unmittelbar zugänglich.','Quellen sind Überreste oder Zeugnisse der Vergangenheit. Ihr Erkenntniswert hängt von der Frage ab.','Darstellungen entstehen später durch Auswahl, Ordnung und Deutung.','Dasselbe Material kann je nach Fragestellung Quelle oder Darstellung sein.']},
{title:'Historische Darstellungen',desc:'Auswahl, Perspektive und Wirkung vergleichen.',recap:['Darstellungen wählen aus, gewichten, deuten und lassen aus.','Perspektiven hängen unter anderem von Fragestellung, Standort und Entstehungszeit ab.','Unterschiedliche Perspektiven sind nicht automatisch falsch. Aussagen müssen sich an Belegen prüfen lassen.']},
{title:'Quellen prüfen',desc:'Aussagewert und Grenzen bestimmen.',recap:['Frage nach Verfasser, Zeitpunkt, Adressat und Absicht.','Unterscheide Beobachtung, Behauptung und Wertung.','Prüfe Perspektive, Aussagewert und Grenzen anhand der konkreten Fragestellung.','Einseitige Quellen sind nicht wertlos: Sie können Einstellungen und Interessen zeigen.']},
{title:'Geschichtsbilder & Geschichtskultur',desc:'Inszenierungen und Gegenwartsbezüge untersuchen.',recap:['Geschichtsbilder verdichten Vorstellungen von Vergangenheit.','Filme, Memes, Denkmäler und digitale Bilder gehören zur Geschichtskultur.','Auswahl und Inszenierung können gegenwärtige Interessen ausdrücken.','Überzeugungskraft beruht auch auf Quellenbezug, Kontext und Überprüfbarkeit.']},
{title:'Die sogenannte „Völkerwanderung“',desc:'Begriffe prüfen. Wandelbare Verbände verstehen.',recap:['„Völkerwanderung“ ist ein problematischer Sammelbegriff für unterschiedliche Vorgänge der Spätantike.','Es wanderten keine unveränderlichen, homogenen und geschlossenen „Völker“. Verbände konnten sich neu bilden und verändern.','Migration, Flucht, militärische Bewegung und Ansiedlung sind zu unterscheiden.','Rom und zugewanderte Gruppen kooperierten und gerieten in Konflikt; Integration verlief unterschiedlich.']},
{title:'Ende des Weströmischen Reiches',desc:'Faktoren verknüpfen. Entwicklungen erklären.',recap:['Adrianopel 378 betraf das oströmische Heer; Rom 410 war ein schwerer symbolischer und politischer Einschnitt. Beide Ereignisse erklären Westroms Ende nicht allein.','Gebietsverluste, sinkende Steuereinnahmen und Rekrutierungsprobleme konnten einander verstärken.','Schwache Kaiser, mächtige Heermeister, Bürgerkriege und politische Konkurrenz erschwerten die Stabilisierung.','Föderaten waren vertraglich gebundene Gruppen, die militärische Dienste leisteten. Kooperation und Konflikt wechselten.','476 endete das weströmische Kaisertum; römische Strukturen bestanden weiter. Es gibt keine hier vorgegebene Hauptursache.']},
{title:'Operatoren',desc:'Belegen. Erklären. Gewichten.',recap:['Herausarbeiten: zentrale Position und Begründungen textnah wiedergeben; keine eigene Meinung.','Erläutern: Material durch Fachwissen verständlich machen und Zusammenhänge erklären.','Beurteilen: Aussage klären, Teilaussagen prüfen, Argumente belegen, gewichten und ein Sachurteil formulieren.']},
{title:'Gemischte Wiederholung',desc:'Deutungen und Belege auf die Probe stellen.',recap:['Nutze Fachbegriffe präzise und beziehe dich auf das Material.','Unterscheide unterschiedliche Perspektiven von unbelegten oder widerlegten Behauptungen.','Begründe Einordnungen; prüfe Aussagewert und Grenzen.']}
];
const tasks=[];
const mat=(text,credit='')=>`<div class="material"><p>${text}</p>${credit?`<small>${credit}</small>`:''}</div>`;
const pair=(a,b)=>`<div class="compare">${mat(a,'Darstellung A')}${mat(b,'Darstellung B')}</div>`;
function add(t,a,type,title,body,data,hints){tasks.push({id:'r3-'+t+'-'+tasks.filter(q=>q.t===t).length,t,a,type,title,body,...data,hints})}
function match(t,a,title,body,opts,rows,hints,type='sort'){add(t,a,type,title,body,{opts,rows},hints)}
function choice(t,a,title,body,opts,correct,explain,hints){add(t,a,'choice',title,body,{opts,correct,explain},hints)}
function multi(t,a,title,body,opts,correct,explain,hints){add(t,a,'multi',title,body,{opts,correct,explain},hints)}
function free(t,a,title,body,criteria,hints){add(t,a,'free',title,body,{criteria},hints)}
function inquiry(t,a,title,body,stages,hints){if((body.match(/class="material"/g)||[]).length>1&&!body.includes('class="compare"'))body='<div class="dossier">'+body+'</div>';add(t,a,'inquiry',title,body,{stages},hints)}
function highlight(t,a,title,body,passages,correct,explain,hints){add(t,a,'highlight',title,body,{passages,correct,explain},hints)}
function scale(t,a,title,body,refs,rows,hints){add(t,a,'scale',title,body,{opts:['direkt gestützt','plausibel erschließbar','nicht ausreichend gestützt'],refs,rows},hints)}
const H=['Unterscheide, was ein Material aussagt, von dem, was du daraus folgerst.','Prüfe Standort, Fragestellung und Reichweite der Belege.','Eine tragfähige Deutung erklärt den Zusammenhang und berücksichtigt mindestens eine Grenze.'];

const migration=mat('Ein Verband überschreitet unter dem Druck gegnerischer Angriffe die Reichsgrenze und bittet um Aufnahme. Nach Versorgungsproblemen kommt es zu bewaffneten Auseinandersetzungen mit römischen Truppen. Später vereinbart eine Führung Landzuweisungen gegen militärische Dienste. Während der Ansiedlung schließen sich weitere Gruppen an; ein Teil folgt einem anderen Anführer. Die römische Verwaltung besteht örtlich weiter, muss ihre Beziehungen zu den militärischen Führungen aber neu aushandeln.');

const expertText='Wer spätantike Migration als Bewegung bereits feststehender Völker beschreibt, setzt die Einheit ihrer Akteure voraus, obwohl gerade deren Entstehung erklärungsbedürftig ist. Zugehörigkeit konnte durch Aufnahme, Abspaltung und Bindung an wechselnde Führungen hergestellt werden. Auch ein über längere Zeit überlieferter Gruppenname beweist daher noch keine gleichbleibende Zusammensetzung. Zugleich entstand der Handlungsspielraum solcher Verbände in Beziehungen zur römischen Herrschaft: Versorgung, militärische Dienste und Ansiedlung wurden ausgehandelt, während Konflikte bestehende Vereinbarungen verändern konnten. So konnte ein Heeresdienstvertrag die Versorgung sichern und die Stellung einer Führung festigen, ohne alle Mitglieder dauerhaft zu binden. Eine Karte mit Wanderungswegen hält solche Veränderungen nur begrenzt fest. Ihre räumliche Übersicht ist nützlich, sofern sie nicht als Abbild einheitlich handelnder Gemeinschaften gelesen wird. Erforderlich ist deshalb eine Untersuchung, die Gruppenbildung und politische Beziehungen aufeinander bezieht, anstatt sie als getrennte Begleiterscheinungen einer Wanderung zu behandeln.';
const expert=mat(expertText,'Fachtext: Gruppenbildung und Handlungsspielräume');

choice(6,7,'Die Leitfrage treffen',speech+'Leitfrage: „Welchen Beitrag leistet die Rede zur Erkenntnis der politischen Interessen des Stadtrats?“ Welche Argumentation antwortet am genauesten?',[

choice(6,7,'Welches Sachurteil ist stärker?',mat('Aussage: „476 endete die römische Ordnung im Westen.“<br>Geprüft: Das weströmische Kaisertum endete; Recht und Verwaltungsverfahren wirkten regional fort, während Herrschaftsbeziehungen sich veränderten.')+'Welches Sachurteil präzisiert die Aussage am besten?',[

function home(){return `<p class="intro">Wähle ein Thema aus.</p><div class="grid">${topics.map((t,i)=>{const qs=tasks.filter(q=>q.t===i),n=qs.filter(done).length;return `<button class="topic" data-view="${i}"><span class="num">Thema ${String(i+1).padStart(2,'0')}</span><h3>${t.title}</h3><span class="desc">${t.desc}</span><span class="foot"><span>${n} / ${qs.length} bearbeitet</span><b aria-hidden="true">↗</b></span></button>`}).join('')}</div>${museumTeaser()}`}
function summary(){const rated=tasks.filter(done);return `<h2>Dein Lernstand</h2>${rated.length?'<p>Nach deinen Antworten und Kriterienprüfungen.</p>':'<p class="empty">Bearbeite eine Aufgabe, um deinen Lernstand einzusehen.</p>'}${areas.map((a,i)=>{const qs=rated.filter(q=>q.a===i);if(!qs.length)return `<div class="statusrow"><span>${a}</span><span class="unrated">noch nicht bearbeitet</span></div>`;const score=qs.reduce((s,q)=>s+state.results[q.id].score,0)/qs.length;return `<div class="statusrow"><span>${a}<br><small class="micro">${qs.length} / ${tasks.filter(q=>q.a===i).length} bearbeitet</small></span><span class="pill ${score<.6?'warn':''}">${score>=.85?'sicher':score>=.6?'weitgehend sicher':'noch üben'}</span></div>`}).join('')}${museumSummary()}${links()}<div class="actions"><button data-view="home">Wähle ein Thema.</button></div>`}
function cards(q){const a=answer(q),source=(r,i)=>`<button type="button" draggable="true" data-source="${i}" aria-pressed="${selected===i}" class="source ${selected===i?'selected':''}">${r[0]}${q.type==='connect'&&a[i]!==undefined?`<span class="assigned">→ ${q.opts[a[i]]}</span>`:''}</button>`;if(q.type==='connect')return `<p class="controlnote">Wähle einen Begriff und die passende Definition. Oder ziehe die Karte.</p><div class="connections"><div>${q.rows.map(source).join('')}</div><div>${q.opts.map((s,j)=>({s,j})).sort((a,b)=>(a.j+1)%q.opts.length-(b.j+1)%q.opts.length).map(({s,j})=>`<button class="target" data-target="${j}">${s}</button>`).join('')}</div></div>`;return `<p class="controlnote">Wähle eine Karte und ein Feld. Oder ziehe die Karte.</p><div class="cardpool">${q.rows.map((r,i)=>a[i]===undefined?source(r,i):'').join('')||'<p>Alle Karten sind zugeordnet.</p>'}</div><div class="bins" style="--cols:${Math.min(3,q.opts.length)}">${q.opts.map((s,j)=>`<section class="bin" data-drop="${j}"><button class="target" data-target="${j}">${s}</button>${q.rows.map((r,i)=>a[i]===String(j)?source(r,i):'').join('')}</section>`).join('')}</div>`}
const expected=s=>Array.isArray(s.correct)?s.correct:[s.correct];
function ordered(id,opts){let seed=Array.from(id).reduce((s,c)=>Math.imul(s^c.charCodeAt(0),16777619),2166136261)>>>0;const list=opts.map((text,index)=>({text,index}));for(let i=list.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[list[i],list[j]]=[list[j],list[i]]}return list}
const phase=q=>Math.min(q.stages.length-1,Math.max(0,Number(answer(q).phase)||0));
function advancedControls(q){const a=answer(q);if(q.type==='highlight')return `<p class="controlnote">Markiere die tragenden Textstellen.</p><div class="passages" role="group" aria-label="Textstellen">${q.passages.map((s,i)=>`<button type="button" class="passage ${(a.picks||[]).includes(i)?'marked':''}" data-mark="${i}" aria-pressed="${(a.picks||[]).includes(i)}">${s}</button>`).join('')}</div>`;
if(q.type==='scale')return q.rows.map((r,i)=>`<section class="evidencecard"><h4>${r[0]}</h4><div class="scalechoices" role="group" aria-label="Belegstärke für Aussage ${i+1}">${q.opts.map((s,j)=>`<label><input type="radio" name="${q.id}-scale${i}" data-answer="scale${i}" value="${j}" ${a['scale'+i]===String(j)?'checked':''}><span>${s}</span></label>`).join('')}</div><label class="controlnote" for="${q.id}-ref${i}">Tragender Materialbezug</label><select id="${q.id}-ref${i}" data-answer="ref${i}"><option value="">Wählen …</option>${q.refs.map((s,j)=>`<option value="${j}" ${a['ref'+i]===String(j)?'selected':''}>${s}</option>`).join('')}</select><p class="reftext" id="${q.id}-refnote${i}">${a['ref'+i]!==undefined&&a['ref'+i]!==''?q.refs[Number(a['ref'+i])]:''}</p></section>`).join('');
const n=phase(q),s=q.stages[n];return `<div class="stagenav" aria-label="Prüfschritte">${q.stages.map((x,i)=>`<button class="${i===n?'current':'secondary'}" data-phase="${i}" aria-current="${i===n?'step':'false'}" ${i>0&&!a['checked'+(i-1)]?'disabled':''}>${i+1}</button>`).join('')}<span>Prüfschritt ${n+1} / ${q.stages.length}</span></div><section class="stagecard"><h4>${s.prompt}</h4><p class="controlnote">${Array.isArray(s.correct)?'Wähle '+s.correct.length+' Aussagen.':'Wähle eine Aussage.'}</p>${ordered(q.id+'-'+n,s.opts).map(({text:x,index:i})=>`<label class="option"><input type="${Array.isArray(s.correct)?'checkbox':'radio'}" name="${q.id}-stage${n}" data-stage="${n}" value="${i}" ${(a['s'+n]||[]).includes(i)?'checked':''}><span>${x}</span></label>`).join('')}</section>`}
function advancedScore(q){const a=answer(q);if(q.type==='highlight')return [Number(equal(a.picks||[],q.correct))];if(q.type==='scale')return q.rows.map((r,i)=>(Number(a['scale'+i]===String(r[1]))+Number(a['ref'+i]!==undefined&&a['ref'+i]!==''&&r[2].includes(Number(a['ref'+i]))))/2);return q.stages.map((s,i)=>Number(equal(a['s'+i]||[],expected(s))))}
function advancedMissing(q){const a=answer(q);if(q.type==='highlight')return !a.picks?.length;if(q.type==='scale')return q.rows.some((r,i)=>a['scale'+i]===undefined||a['ref'+i]===undefined||a['ref'+i]==='');return !a['s'+phase(q)]?.length}
function advancedFeedback(q){const a=answer(q);if(q.type==='inquiry'){const n=phase(q);if(!a['checked'+n])return '';const good=advancedScore(q)[n]===1;return `<p class="${good?'good':'warn'}"><strong>${good?'✓ Tragfähig.':'△ Noch prüfen.'}</strong> ${q.stages[n].explain}</p>${done(q)?`<p class="controlnote">${advancedScore(q).filter(x=>x===1).length} / ${q.stages.length} Prüfschritte tragfähig.</p>`:''}${n<q.stages.length-1?'<button data-action="nextstage">Nächster Prüfschritt</button>':''}`}if(!done(q))return '';if(q.type==='highlight'){const good=state.results[q.id].score===1;return `<p class="${good?'good':'warn'}"><strong>${good?'✓ Tragfähige Auswahl.':'△ Die Belegauswahl noch prüfen.'}</strong> ${q.explain}</p>`}return `<ul>${q.rows.map((r,i)=>`<li class="${advancedScore(q)[i]===1?'good':'warn'}">${advancedScore(q)[i]===1?'✓':'△'} ${r[0]}<br>${r[3]}${a['scale'+i]!==String(r[1])?' Prüfe die Reichweite der Aussage.':''}${!r[2].includes(Number(a['ref'+i]))?' Prüfe den Materialbezug.':''}</li>`).join('')}</ul>`}
function paintStage(q,el){refreshControls(q,el);const fb=el.querySelector('.feedback');fb.innerHTML=advancedFeedback(q);fb.hidden=!fb.innerHTML;el.querySelector('.interaction').scrollIntoView({block:'nearest'})}
function checkStage(q,el){const a=answer(q),n=phase(q);a['checked'+n]=true;if(q.stages.every((s,i)=>a['checked'+i])){const p=advancedScore(q);state.results[q.id]={score:p.reduce((s,x)=>s+x,0)/p.length};el.querySelector('[data-action=retry]').hidden=false}save();updateProgress();paintStage(q,el)}

function controls(q){const a=answer(q);if(['highlight','scale','inquiry'].includes(q.type))return advancedControls(q);if(q.type==='choice'||q.type==='multi')return `<fieldset><legend class="controlnote">${q.type==='multi'?'Markiere alle passenden Aussagen.':'Wähle eine Antwort.'}</legend>${ordered(q.id,q.opts).map(({text:x,index:i})=>`<label class="option"><input type="${q.type==='multi'?'checkbox':'radio'}" name="${q.id}" data-answer="${q.type==='multi'?'picks':'pick'}" value="${i}" ${q.type==='multi'?(a.picks||[]).includes(i)?'checked':'':a.pick===String(i)?'checked':''}><span>${x}</span></label>`).join('')}</fieldset>`;
if(q.type==='sort'||q.type==='connect')return cards(q);
if(q.type==='rubric')return q.rows.map((r,i)=>`<section class="rubricrow"><h4>Erklärung ${i+1}</h4>${mat(r[0])}<label for="${q.id}-rating${i}">Bewertung</label><select id="${q.id}-rating${i}" data-answer="rating${i}"><option value="">Wählen …</option>${q.opts.map((s,j)=>`<option value="${j}" ${a['rating'+i]===String(j)?'selected':''}>${s}</option>`).join('')}</select><p class="controlnote">Welche Kriterien erfüllt der Wortlaut?</p>${q.criteria.map((c,j)=>`<label class="option"><input type="checkbox" data-rubric="${i}" value="${j}" ${(a['rubric'+i]||[]).includes(j)?'checked':''}><span>${c}</span></label>`).join('')}</section>`).join('');
if(q.type==='order')return `<p class="controlnote">Bringe die Karten in die passende Reihenfolge. Ziehe sie oder nutze die Pfeile.</p><div class="orderlist">${(a.order||q.cards.map((x,i)=>i)).map((j,i)=>`<div class="ordercard" draggable="true" data-order="${j}" data-slot="${i}"><span class="ordinal">${i+1}</span><span>${q.cards[j]}</span><div class="move"><button class="secondary" data-move="${i}" data-delta="-1" aria-label="Karte ${i+1} nach oben" ${i===0?'disabled':''}>↑</button><button class="secondary" data-move="${i}" data-delta="1" aria-label="Karte ${i+1} nach unten" ${i===q.cards.length-1?'disabled':''}>↓</button></div></div>`).join('')}</div>`;
return `<label class="controlnote" for="${q.id}-text">Kurze Begründung · 1–3 Sätze</label><textarea id="${q.id}-text" data-answer="text" maxlength="450" rows="3" placeholder="Begründe mit Material und Fachwissen.">${esc(a.text||'')}</textarea>`}
function review(q){const a=answer(q);return `<div class="review" ${!a.open?'hidden':''}><h3>Kriterien prüfen</h3><p>Vergleiche die Begründung mit den Kriterien. Markiere, was du erfüllt hast.</p>${q.criteria.map((c,i)=>`<label class="option"><input type="checkbox" data-criterion="${i}" ${a.criteria?.includes(i)?'checked':''}><span>${c}</span></label>`).join('')}<button data-action="assess">Rückmeldung übernehmen</button></div>`}
function scoreParts(q){const a=answer(q);if(['highlight','scale','inquiry'].includes(q.type))return advancedScore(q);if(q.type==='choice')return [Number(Number(a.pick)===q.correct)];if(q.type==='multi')return [Number(equal(a.picks||[],q.correct))];if(q.type==='sort'||q.type==='connect')return q.rows.map((r,i)=>Number(Number(a[i])===r[1]));if(q.type==='order')return [Number(equalOrder(a.order||q.cards.map((x,i)=>i),q.correct))];if(q.type==='rubric')return q.rows.map((r,i)=>(Number(Number(a['rating'+i])===r[1])+Number(equal(a['rubric'+i]||[],r[2])))/2);return [(a.criteria||[]).length/q.criteria.length]}
function equalOrder(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i])}
function feedback(q){if(['highlight','scale','inquiry'].includes(q.type))return advancedFeedback(q);if(!done(q))return '';const a=answer(q),r=state.results[q.id],parts=scoreParts(q),line=(good,text)=>`<li class="${good?'good':'warn'}">${good?'✓':'△'} ${good?'Richtig.':'Noch prüfen.'} ${text}</li>`;if(q.type==='free')return `<p><strong>Kriterienprüfung</strong></p><ul>${q.criteria.map((c,i)=>`<li class="${a.criteria?.includes(i)?'good':'warn'}">${a.criteria?.includes(i)?'✓':'△'} ${c}${a.criteria?.includes(i)?'':' – noch prüfen'}</li>`).join('')}</ul>`;if(['choice','order'].includes(q.type))return `<p class="${r.score===1?'good':'warn'}"><strong>${r.score===1?'✓ Richtig.':'△ Noch nicht richtig.'}</strong> ${q.explain}</p>`;if(q.type==='multi')return `<ul>${ordered(q.id,q.opts).map(({text:x,index:i})=>line((a.picks||[]).includes(i)===q.correct.includes(i),x+(q.correct.includes(i)?' – passt.':' – passt nicht.'))).join('')}</ul><p>${q.explain}</p>`;return `<ul>${q.rows.map((row,i)=>line(parts[i]===1,row[0]+'<br>'+row[q.type==='rubric'?3:2])).join('')}</ul>`}
function exercise(q,n){const h=Math.min(3,state.hints[q.id]||0);return `<article class="exercise" id="${q.id}" data-id="${q.id}"><h3>${q.title}</h3>${q.body}<div class="interaction">${controls(q)}</div><div class="actions"><button data-action="check">Prüfen</button><button class="secondary" data-action="hint" ${h===3?'disabled':''}>Hinweis${h?' · '+h+'/3':''}</button><button class="quiet" data-action="retry" ${done(q)?'':'hidden'}>Noch einmal versuchen</button></div><div class="hint" ${h?'':'hidden'}><span class="micro">${['','Denkanstoß','Konkreter Hinweis','Mögliche Aspekte'][h]}</span><p>${h?q.hints[h-1]:''}</p></div>${q.type==='free'?review(q):''}<div class="feedback" role="status" ${done(q)||(q.type==='inquiry'&&answer(q)['checked'+phase(q)])?'':'hidden'}>${feedback(q)}</div></article>`}
function topic(i){const t=topics[i],qs=tasks.filter(q=>q.t===i),n=Math.max(0,Math.min(qs.length-1,Number(state.positions[i])||0));state.positions[i]=n;return `<div class="sectionhead"><h2>${t.title}</h2><span class="count">Thema ${i+1} / 8</span></div><details class="recap"><summary>Wiederholen</summary><ul>${t.recap.map(x=>`<li>${x}</li>`).join('')}</ul></details><div class="tasknav"><span>Aufgabe ${n+1} / ${qs.length}${done(qs[n])?' · bearbeitet':''}</span><label>Aufgabe wählen<select id="taskSelect" aria-label="Aufgabe wählen">${qs.map((q,j)=>`<option value="${j}" ${n===j?'selected':''}>${j+1}. ${q.title}</option>`).join('')}</select></label></div>${exercise(qs[n],n)}${(i===6||i===7)&&n===qs.length-1?links():''}<div class="endnav"><button class="secondary" data-step="-1" ${n===0?'disabled':''}>Zurück</button><button class="secondary" data-view="home">Themenübersicht</button>${n<qs.length-1?'<button data-step="1">Weiter</button>':`<button data-view="${i===7?'summary':i+1}">${i===7?'Dein Lernstand':'Nächstes Thema'}</button>`}</div>`}
function show(v,focus=true){view=v;selected=null;dragged=null;main.innerHTML=v==='home'?home():v==='summary'?summary():v==='museum'?museumView():topic(Number(v));document.querySelectorAll('nav [data-view]').forEach(el=>el.setAttribute('aria-current',el.dataset.view===String(v)?'page':'false'));updateProgress();if(focus){main.focus({preventScroll:true});main.scrollIntoView({behavior:'instant',block:'start'})}}
function invalidate(q,el){delete state.results[q.id];if(q.type==='free'){answer(q).open=false;el.querySelector('.review').hidden=true}el.querySelector('.feedback').hidden=true;el.querySelector('[data-action=retry]').hidden=true;save();updateProgress()}
function context(el){const card=el.closest('[data-id]');return {el:card,q:card?tasks.find(q=>q.id===card.dataset.id):null}}
function refreshControls(q,el){el.querySelector('.interaction').innerHTML=controls(q)}
function assign(q,el,source,target){state.answers[q.id]??={};state.answers[q.id][source]=String(target);selected=null;invalidate(q,el);refreshControls(q,el)}
function move(q,el,from,to){if(from===to)return;const order=[...(answer(q).order||q.cards.map((x,i)=>i))];const [item]=order.splice(from,1);order.splice(to,0,item);state.answers[q.id]??={};state.answers[q.id].order=order;invalidate(q,el);refreshControls(q,el);el.querySelector(`[data-move="${to}"]`)?.focus()}
main.addEventListener('input',e=>{const {el,q}=context(e.target);if(!q)return;state.answers[q.id]??={};const a=answer(q),ds=e.target.dataset;if(ds.stage!==undefined){const n=Number(ds.stage);a['s'+n]=Array.from(el.querySelectorAll('[data-stage="'+n+'"]:checked'),x=>Number(x.value));for(let j=n;j<q.stages.length;j++)a['checked'+j]=false;el.querySelector('[data-action=nextstage]')?.setAttribute('hidden','');el.querySelectorAll('[data-phase]').forEach(b=>b.disabled=Number(b.dataset.phase)>0&&!a['checked'+(Number(b.dataset.phase)-1)]);invalidate(q,el);return}if(ds.criterion!==undefined){a.criteria=Array.from(el.querySelectorAll('[data-criterion]:checked'),x=>Number(x.dataset.criterion));delete state.results[q.id];el.querySelector('.feedback').hidden=true;save();updateProgress();return}if(ds.rubric!==undefined){const type='rubric',index=ds[type];a[type+index]=Array.from(el.querySelectorAll(`[data-${type}="${index}"]:checked`),x=>Number(x.value))}else if(ds.answer==='picks')a.picks=Array.from(el.querySelectorAll('[data-answer=picks]:checked'),x=>Number(x.value));else if(ds.answer!==undefined){a[ds.answer]=e.target.value;if(q.type==='scale'&&ds.answer.startsWith('ref'))el.querySelector('#'+q.id+'-refnote'+ds.answer.slice(3)).textContent=e.target.value===''?'':q.refs[Number(e.target.value)]}else return;invalidate(q,el)});
main.addEventListener('change',e=>{if(e.target.id==='taskSelect'){state.positions[view]=Number(e.target.value);save();show(view)}});
main.addEventListener('dragstart',e=>{const src=e.target.closest('[data-source],[data-order]');if(!src)return;const {q}=context(src);dragged={id:q.id,index:src.dataset.source!==undefined?Number(src.dataset.source):Number(src.dataset.order),order:src.dataset.order!==undefined};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragged.index))});
main.addEventListener('dragover',e=>{if(e.target.closest('[data-target],[data-drop],[data-slot]'))e.preventDefault()});
main.addEventListener('drop',e=>{const dest=e.target.closest('[data-target],[data-drop],[data-slot]');if(!dest||!dragged)return;e.preventDefault();const {el,q}=context(dest);if(!q||dragged.id!==q.id)return;if(dragged.order){const order=answer(q).order||q.cards.map((x,i)=>i);move(q,el,order.indexOf(dragged.index),Number(dest.dataset.slot))}else assign(q,el,dragged.index,Number(dest.dataset.target??dest.dataset.drop));dragged=null});
main.addEventListener('dragend',()=>dragged=null);
function missing(q){const a=answer(q);if(['highlight','scale','inquiry'].includes(q.type))return advancedMissing(q);if(q.type==='free')return !a.text?.trim();if(q.type==='choice')return a.pick===undefined;if(q.type==='multi')return !a.picks?.length;if(q.type==='sort'||q.type==='connect')return q.rows.some((r,i)=>a[i]===undefined);if(q.type==='rubric')return q.rows.some((r,i)=>a['rating'+i]===undefined||a['rating'+i]===''||!a['rubric'+i]?.length);return false}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){show(nav.dataset.view);return}const step=e.target.closest('[data-step]');if(step){state.positions[view]+=Number(step.dataset.step);save();show(view);return}const {el,q}=context(e.target);if(!q)return;const marked=e.target.closest('[data-mark]');if(marked){state.answers[q.id]??={};const a=answer(q),i=Number(marked.dataset.mark);a.picks=(a.picks||[]).includes(i)?a.picks.filter(x=>x!==i):[...(a.picks||[]),i];invalidate(q,el);marked.classList.toggle('marked',a.picks.includes(i));marked.setAttribute('aria-pressed',String(a.picks.includes(i)));return}const ph=e.target.closest('[data-phase]');if(ph){state.answers[q.id]??={};answer(q).phase=Number(ph.dataset.phase);save();paintStage(q,el);return}const src=e.target.closest('[data-source]');if(src){selected=Number(src.dataset.source);refreshControls(q,el);el.querySelector(`[data-source="${selected}"]`)?.focus();return}const target=e.target.closest('[data-target]');if(target){if(selected===null){el.querySelector('.feedback').hidden=false;el.querySelector('.feedback').textContent='Wähle zuerst eine Karte.'}else assign(q,el,selected,Number(target.dataset.target));return}const mv=e.target.closest('[data-move]');if(mv){move(q,el,Number(mv.dataset.move),Number(mv.dataset.move)+Number(mv.dataset.delta));return}const btn=e.target.closest('[data-action]');if(!btn)return;const a=answer(q),act=btn.dataset.action,fb=el.querySelector('.feedback');if(act==='hint'){const h=Math.min(3,(state.hints[q.id]||0)+1);state.hints[q.id]=h;el.querySelector('.hint').hidden=false;el.querySelector('.hint').innerHTML=`<span class="micro">${['','Denkanstoß','Konkreter Hinweis','Mögliche Aspekte'][h]}</span><p>${q.hints[h-1]}</p>`;btn.textContent=`Hinweis · ${h}/3`;btn.disabled=h===3;save();return}if(act==='nextstage'){a.phase=Math.min(q.stages.length-1,phase(q)+1);save();paintStage(q,el);return}if(act==='retry'){delete state.results[q.id];delete state.answers[q.id];selected=null;save();el.outerHTML=exercise(q,state.positions[view]);updateProgress();return}if(act==='check'){if(missing(q)){fb.hidden=false;fb.textContent=q.type==='free'?'Formuliere eine kurze Begründung.':'Vervollständige zuerst die Zuordnung oder Auswahl.';return}if(q.type==='inquiry'){checkStage(q,el);return}if(q.type==='free'){a.open=true;el.querySelector('.review').hidden=false;fb.hidden=true;save();return}}if(act==='assess'&&!a.text?.trim())return;if(act==='check'||act==='assess'){const parts=scoreParts(q);state.results[q.id]={score:parts.reduce((s,x)=>s+x,0)/parts.length};fb.innerHTML=feedback(q);fb.hidden=false;el.querySelector('[data-action=retry]').hidden=false;save();updateProgress()}});
document.querySelector('#reset').onclick=()=>{const box=document.querySelector('#resetbox');box.hidden=false;document.querySelector('#cancelReset').focus();box.scrollIntoView({block:'nearest'})};
document.querySelector('#cancelReset').onclick=()=>{document.querySelector('#resetbox').hidden=true;document.querySelector('#reset').focus()};
document.querySelector('#confirmReset').onclick=()=>{state={answers:{},results:{},hints:{},positions:{},revision:3};try{localStorage.removeItem(KEY)}catch(e){}document.querySelector('#resetbox').hidden=true;show('home')};
const museumObjects=[
{id:1,title:'Bericht des Ammianus Marcellinus',date:'Ende des 4. Jahrhunderts',type:'Schriftquelle',icon:'scroll',text:'Ammianus berichtet von gotischen Gruppen, die 376 vor den Hunnen an die Donau flohen und um Aufnahme ins Reich baten. Nach der Aufnahme kam es zu Versorgungsproblemen, Misshandlungen durch römische Amtsträger und schließlich zu Gewalt.',tags:['text','zeitnah','migration','aufnahme','konflikt','militaer','politik','roemisch'],gain:'Mit Ammianus werden Flucht, Aufnahme und das Scheitern der Versorgung gemeinsam sichtbar. Sein Bericht erschließt dabei eine römisch geprägte Deutung, nicht unmittelbar die Stimmen aller Betroffenen.'},
{id:2,title:'Spätantiker Bericht über die Einnahme Roms',date:'Ereignis: 410 n. Chr.',type:'Schriftquelle',icon:'scroll',text:'Ein spätantiker Autor schildert die Einnahme Roms durch Alarichs Truppen. Er hebt Gewalt, Unsicherheit und die erschütternde Wirkung der Nachricht auf Zeitgenossen hervor.',tags:['text','zeitnah','konflikt','militaer','politik','roemisch'],gain:'Der Bericht rückt Gewalterfahrungen und die Wirkung der Einnahme Roms in den Vordergrund. Er erklärt damit noch nicht sämtliche Ursachen oder den Verlauf in anderen Regionen.'},
{id:3,title:'Orosius über den Westgotenkönig Athaulf',date:'Frühes 5. Jahrhundert',type:'Schriftquelle',icon:'book',text:'Orosius berichtet über einen Vermittler, Athaulf habe zunächst ein gotisches an die Stelle des Römischen Reiches setzen wollen. Später habe er römische Ordnung mithilfe der Goten wiederherstellen wollen.',tags:['text','zeitnah','kooperation','politik','kontinuitaet','transformation','roemisch'],gain:'Orosius macht ein Programm zur Wiederherstellung römischer Ordnung mit gotischen Kräften greifbar. Athaulfs Pläne sind mehrfach vermittelt; Bericht, zugeschriebene Absicht und tatsächliche Umsetzung sind zu unterscheiden.'},
{id:4,title:'Weströmische Goldmünze',date:'5. Jahrhundert',type:'Sachquelle',icon:'coin',text:'Die Münze zeigt einen weströmischen Kaiser mit traditionellen Herrschaftssymbolen. Auch in politisch unsicherer Zeit erhebt das Kaiserbild einen Anspruch auf stabile und legitime Herrschaft.',tags:['materiell','zeitnah','politik','kontinuitaet','roemisch'],gain:'Das Kaiserbild zeigt den Anspruch auf legitime Herrschaft und die Fortführung römischer Bildsprache. Aus diesem Anspruch allein folgt noch keine tatsächliche politische Stabilität.'},
{id:5,title:'Kriegergrab aus dem 5. Jahrhundert',date:'Westliches Mitteleuropa',type:'Archäologischer Fund',icon:'grave',text:'Waffen, Schmuck und Gürtelbestandteile gehören zu den Beigaben. Einzelne Gegenstände weisen Verbindungen zu verschiedenen Regionen auf. Eine eindeutige ethnische Zuordnung des Bestatteten allein anhand dieser Beigaben ist schwierig.',tags:['materiell','zeitnah','archaeologie','militaer','heterogenitaet','bestattung'],gain:'Die Grabbeigaben eröffnen einen Zugang zu Bestattung, Status und regionalen Verbindungen. Waffen beweisen für sich weder eine bestimmte ethnische Zugehörigkeit noch den Lebenslauf eines Kriegers.'},
{id:6,title:'Römischer Militärgürtel',date:'Gallien, 5. Jahrhundert',type:'Sachquelle',icon:'belt',text:'Vergleichbare Gürtel wurden von Soldaten der römischen Armee getragen. In ihr dienten auch Männer, deren Familien oder Verbände ursprünglich von außerhalb des Imperiums stammten.',tags:['materiell','zeitnah','militaer','aufnahme','kooperation','kontinuitaet','heterogenitaet'],gain:'Der Militärgürtel und seine Vergleichsfunde eröffnen einen Zugang zum Dienst für Rom. Menschen unterschiedlicher Herkunft konnten Teil der Armee werden; die Herkunft eines einzelnen Trägers lässt sich aus dem Gürtel allein nicht ablesen.'},
{id:7,title:'Nachrichten über Ansiedlung und Militärdienst',date:'Spätantike',type:'Schriftzeugnis',icon:'scroll',text:'Spätantike Nachrichten lassen Vereinbarungen zwischen römischen Amtsträgern und Verbänden erkennen: Ansiedlung im Reich konnte mit militärischen Leistungen verbunden sein. Die genauen Bedingungen sind nicht überall vollständig überliefert.',tags:['text','zeitnah','militaer','aufnahme','kooperation','politik','kontinuitaet','transformation'],gain:'Die Nachrichten machen vertraglich geregelte Beziehungen und gemeinsame militärische Aufgaben sichtbar. Ein vollständig erhaltener Vertragstext mit überall gleichen Bedingungen ist damit nicht vorausgesetzt.'},
{id:8,title:'Historische Karte: Europa im 4. und 5. Jahrhundert',date:'Heutige Rekonstruktion',type:'Historische Darstellung',icon:'map',text:'Die Karte rekonstruiert Bewegungen von Goten, Vandalen, Sueben und Hunnen über mehrere Jahrzehnte. Verschiedene Routen, Zwischenstationen und neue Herrschaftsräume werden zusammengeführt.',tags:['spaeter','migration','politik','transformation','darstellung'],gain:'Die Karte führt verschiedene Routen und neue Herrschaftsräume zusammen. Ihre Übersicht beruht auf nachträglicher Auswahl; Pfeile und Gruppennamen bilden wechselnde Zugehörigkeiten nur begrenzt ab.'},
{id:9,title:'Auszug aus Jordanes’ „Getica“',date:'6. Jahrhundert',type:'Schriftquelle',icon:'book',text:'Jordanes erzählt rückblickend von Herkunft, Wanderungen und Herrschern der Goten. Die Goten erscheinen über lange Zeiträume als zusammengehörige Gemeinschaft. Zu vielen geschilderten Vorgängen besteht ein erheblicher zeitlicher Abstand.',tags:['text','spaeter','migration','politik','darstellung','voelkerbild'],gain:'Jordanes erweitert den Blick um eine rückblickende Herkunftserzählung des 6. Jahrhunderts. Die erzählte Zusammengehörigkeit ist zu untersuchen und nicht mit einer unveränderten Zusammensetzung früherer Verbände gleichzusetzen.'},
{id:10,title:'„Die Völkerwanderung“',date:'Historiengemälde, 19. Jahrhundert',type:'Geschichtskultur',icon:'painting',text:'Menschen mit Wagen, Frauen, Kindern und bewaffneten Männern ziehen durch eine dramatische Landschaft. Das Gemälde entstand viele Jahrhunderte nach den dargestellten Vorgängen.',tags:['spaeter','migration','militaer','geschichtskultur','voelkerbild','darstellung'],gain:'Das Historiengemälde zeigt nun auch, wie spätere Zeiten Bewegung, Gemeinschaft und bewaffnete Akteure inszenierten. Es ist ein Zeugnis dieses späteren Geschichtsbildes, kein unmittelbarer Bildbericht aus der Spätantike.'},
{id:11,title:'Seite aus einem deutschen Geschichtsschulbuch',date:'Um 1900',type:'Historische Darstellung',icon:'book',text:'Der Text beschreibt spätantike Bewegungen als Wanderung germanischer „Völker“ und verbindet sie eng mit dem Ende Westroms. Die Darstellung ordnet Vorgänge aus großer zeitlicher Distanz.',tags:['text','spaeter','migration','politik','geschichtskultur','voelkerbild','darstellung'],gain:'Die Schulbuchseite macht die Deutung um 1900 zum Gegenstand der Ausstellung. Ihre Verbindung von wandernden „Völkern“ und Westroms Ende muss an Quellen, Befunden und alternativen Erklärungen geprüft werden.'},
{id:12,title:'Untersuchung eines spätantiken Gräberfeldes',date:'Archäologische Auswertung',type:'Forschungsbefund',icon:'field',text:'Forschende vergleichen unterschiedliche Bestattungssitten und Gegenstände verschiedener Herkunft. Die Befunde lassen sich nicht eindeutig einer einzigen geschlossenen ethnischen Gruppe zuordnen.',tags:['materiell','spaeter','archaeologie','heterogenitaet','bestattung','forschung'],gain:'Die Gräberfelduntersuchung bringt Vergleich, Fundkontext und Grenzen ethnischer Zuordnung ins Spiel. Unterschiedliche Gegenstände oder Bestattungssitten sind nicht ohne Weiteres mit getrennten „Völkern“ gleichzusetzen.'}
];
const museumById=id=>museumObjects.find(x=>x.id===id);
const museumCount=(ids,tag)=>ids.filter(id=>museumById(id)?.tags.includes(tag)).length;
const museumGoals={
coop:{tag:'kooperation',title:'Kooperation sichtbar machen',request:'Tausche genau ein Exponat aus, sodass Kooperation oder gemeinsame römische Strukturen stärker sichtbar werden.'},
material:{tag:'materiell',title:'Einen materiellen Zugang ergänzen',request:'Tausche genau ein Exponat aus, sodass Objekte oder archäologische Befunde stärker zur Geschichte der Ausstellung beitragen.'},
later:{tag:'spaeter',title:'Den späteren Blick einbeziehen',request:'Tausche genau ein Exponat aus und mache einen späteren Zugriff auf die Epoche stärker sichtbar.'},
near:{tag:'zeitnah',title:'Näher an die Spätantike heranrücken',request:'Tausche genau ein Exponat aus, sodass ein zeitnahes Zeugnis der Spätantike stärker zur Ausstellung beiträgt.'},
variety:{tag:'heterogenitaet',title:'Gruppenzugehörigkeit hinterfragen',request:'Tausche genau ein Exponat aus und gib den Grenzen eindeutiger Herkunfts- oder Gruppenzuordnungen mehr Raum.'},
arch:{tag:'archaeologie',title:'Einen Fundzusammenhang einbeziehen',request:'Tausche genau ein Exponat aus, sodass archäologische Kontexte stärker sichtbar werden.'},
culture:{tag:'geschichtskultur',title:'Erinnerung zum Ausstellungsgegenstand machen',request:'Tausche genau ein Exponat aus und zeige stärker, wie spätere Zeiten das Bild dieser Epoche formten.'}
};
function museumPairs(ids,key){const tag=museumGoals[key].tag,n=museumCount(ids,tag),pairs=[];for(const out of ids)for(const obj of museumObjects)if(!ids.includes(obj.id)&&museumCount(ids.filter(x=>x!==out).concat(obj.id),tag)>n)pairs.push([out,obj.id]);return pairs}
function museumChallenge(ids){const n=tag=>museumCount(ids,tag),options=[
['coop',n('militaer')>=3&&n('kooperation')<2,`${n('militaer')} Exponate eröffnen militärische Zugänge. Daneben möchte der Beirat Zusammenarbeit und gemeinsame Strukturen stärker sichtbar machen.`],
['material',n('text')>=4||n('materiell')===0,`Deine Ausstellung enthält ${n('text')} Textzeugnisse und ${n('materiell')} materielle Zugänge. Der Beirat wünscht einen stärkeren Zugang über Objekte oder Befunde.`],
['later',n('zeitnah')>=4,`Mit ${n('zeitnah')} zeitnahen Zeugnissen liegt der Schwerpunkt auf der Spätantike. Ein späterer Zugriff soll diesen Blick ergänzen.`],
['near',n('spaeter')>=4,`${n('spaeter')} Exponate erschließen spätere Rückblicke, Rekonstruktionen oder Forschung. Ein zeitnahes Zeugnis soll mehr Raum erhalten.`],
['variety',n('voelkerbild')>=2&&n('heterogenitaet')===0,`${n('voelkerbild')} Exponate lassen eine Lesart als Geschichte zusammengehöriger „Völker“ zu. Der Beirat möchte deren Gruppenzuordnungen stärker hinterfragen.`],
['arch',n('archaeologie')===0,'Bislang ist kein archäologischer Fundzusammenhang vertreten. Der Beirat möchte diese Art der Überprüfung ergänzen.'],
['culture',n('geschichtskultur')===0,'Die Ausstellung soll zusätzlich zeigen, wie spätere Erinnerung unsere Vorstellungen von der Epoche prägt.'],
['variety',true,'Der Beirat setzt einen neuen Schwerpunkt: Die Aussagekraft von Herkunfts- und Gruppenzuordnungen soll stärker untersucht werden.'],
['material',true,'Der Beirat möchte den Zugang über materielle Zeugnisse bewusst verstärken.'],
['coop',true,'Der Beirat möchte den Blick auf Kooperation bewusst verstärken.']
];const found=options.find(([key,condition])=>condition&&museumPairs(ids,key).length);return {key:found[0],intro:found[2]}}
function freshMuseum(){return {phase:'depot',selected:[],initial:[],out:null,in:null,challenge:null,complete:false}}
function cleanMuseum(raw){const m={...freshMuseum(),...(raw&&typeof raw==='object'?raw:{})};m.selected=Array.from(new Set(Array.isArray(m.selected)?m.selected:[])).filter(id=>museumById(id)).slice(0,5);m.initial=Array.from(new Set(Array.isArray(m.initial)?m.initial:[])).filter(id=>museumById(id));if(!['depot','exhibition','compare'].includes(m.phase))m.phase='depot';if(m.phase!=='depot'&&m.initial.length!==5)m.phase='depot';if(m.phase==='depot'){m.complete=false;m.initial=[];m.challenge=null}else{const challenge=museumChallenge(m.initial);m.challenge=challenge;if(m.phase==='exhibition'){m.selected=[...m.initial];m.complete=false}if(m.phase==='compare'&&(m.selected.length!==5||m.initial.filter(id=>!m.selected.includes(id)).length!==1||m.selected.filter(id=>!m.initial.includes(id)).length!==1||museumCount(m.selected,museumGoals[challenge.key].tag)<=museumCount(m.initial,museumGoals[challenge.key].tag))){m.phase='exhibition';m.selected=[...m.initial];m.complete=false}}return m}
state.museum=cleanMuseum(state.museum);
if(state.museum.phase==='compare'){state.museum.out=state.museum.initial.find(id=>!state.museum.selected.includes(id));state.museum.in=state.museum.selected.find(id=>!state.museum.initial.includes(id))}
function museumObservations(ids){const n=tag=>museumCount(ids,tag),notes=[];
if(n('militaer')>=3)notes.push(['Militärische Zugänge prägen den Blick.',`${n('militaer')} deiner fünf Exponate thematisieren bewaffnete Akteure, Konflikte oder Militärdienst. Militärdienst für Rom ist dabei von einem Angriff auf Rom zu unterscheiden.`]);
else if(n('migration')>=3)notes.push(['Bewegungen stehen im Vordergrund.',`${n('migration')} Exponate erschließen Wanderungen oder deren spätere Darstellung. Routen und Gruppennamen erklären für sich noch nicht Motive, Zugehörigkeiten und Veränderungen.`]);
else if(n('text')>=4)notes.push(['Schriftliche Überlieferung hat großes Gewicht.',`${n('text')} Exponate eröffnen den Zugang über Texte. Verfasser, Absichten und Informationswege beeinflussen, was von den Vorgängen greifbar wird.`]);
else{const labels={politik:'Politische Ordnung',kooperation:'Kooperation',materiell:'Materielle Zugänge'},key=Object.keys(labels).sort((a,b)=>n(b)-n(a))[0];notes.push([labels[key]+' wird sichtbar.',`${n(key)} deiner fünf Exponate eröffnen diesen Zugang. Das ist eine Schwerpunktsetzung; andere Aspekte der Epoche werden damit noch nicht vollständig erfasst.`])}
if(n('roemisch')>=2)notes.push(['Römisch geprägte Sichtweisen sind mehrfach vertreten.',`${n('roemisch')} Exponate erschließen römische Deutungen oder kaiserliche Selbstdarstellung. Die Erfahrungen anderer Beteiligter sind damit nicht gleichermaßen erfasst.`]);
else if(n('heterogenitaet'))notes.push(['Eindeutige Gruppenzuordnungen werden fraglich.',`${n('heterogenitaet')} Exponate eröffnen einen differenzierten Blick auf Herkunft und Zugehörigkeit. Gegenstände, militärischer Dienst und ethnische Identität sind nicht einfach gleichzusetzen.`]);
else notes.push(['Zusammengehörigkeit wird als Geschichtsbild greifbar.',`${n('voelkerbild')} Exponate können den Eindruck länger zusammengehöriger Gemeinschaften nahelegen. Eine solche Darstellung beweist noch keine unveränderte Zusammensetzung der Verbände.`]);
if(n('zeitnah')&&n('spaeter'))notes.push(['Zeitnahe Zeugnisse und spätere Zugriffe sind verbunden.',`${n('zeitnah')} Exponate stammen aus dem zeitlichen Umfeld der behandelten Epoche; ${n('spaeter')} erschließen spätere Rückblicke, Darstellungen oder Forschung. Ihr jeweiliger Erkenntniswert ist zu unterscheiden.`]);
else if(n('zeitnah'))notes.push(['Spätere Zugriffe bleiben im Hintergrund.',`Alle fünf Exponate sind zeitnahe Zeugnisse. Wie nachfolgende Zeiten die Epoche erzählten, inszenierten oder neu untersuchten, ist damit kaum Gegenstand der Ausstellung.`]);
else notes.push(['Spätere Zugriffe stehen im Mittelpunkt.',`Die fünf Exponate erschließen Rückblicke, Rekonstruktionen, Geschichtskultur oder Forschung. Zeitnahe Zeugnisse werden nicht als eigene Exponate gezeigt.`]);
if(!n('materiell'))notes.push(['Materielle Befunde fehlen.',`Keines der fünf Exponate eröffnet einen eigenen Zugang über Objekte oder archäologische Befunde. Diese könnten Textüberlieferungen und spätere Bilder ergänzen oder infrage stellen.`]);
else if(n('archaeologie'))notes.push(['Archäologische Kontexte erweitern die Auswahl.',`${n('archaeologie')} Exponate erschließen Fundzusammenhänge. Unterschiedliche Gegenstände oder Bestattungssitten erlauben nicht automatisch eine eindeutige ethnische Zuordnung.`]);
else notes.push(['Objekte brauchen Einordnung.',`${n('materiell')} Exponate eröffnen einen materiellen Zugang. Funktion, Vergleich und Kontext bleiben nötig; ein Herrschaftssymbol oder Gürtel spricht nicht für sich.`]);
if(n('migration')&&n('aufnahme'))notes.push(['Bewegung und Aufnahme werden gemeinsam sichtbar.',`Deine Auswahl erschließt sowohl Migration als auch Aufnahme, Ansiedlung oder Militärdienst im Reich. Eine Aufnahme ist noch kein Beleg für konfliktfreie oder gelungene Integration.`]);
return notes}
const museumAxes=[['Konflikt','konflikt','Zusammenleben / Kooperation','kooperation'],['Migration','migration','Aufnahme / Integration','aufnahme'],['Zeitnahe Zeugnisse','zeitnah','Spätere Zugriffe','spaeter'],['Textzeugnisse','text','Materielle Befunde','materiell']];
function museumProfile(ids,title='Ausstellungsprofil'){return `<section class="museum-profile" aria-label="${title}"><h3>${title}</h3>${museumAxes.map(([left,l,right,r])=>`<div class="museum-axis"><div><span>${left}</span><b>${museumCount(ids,l)} / 5</b><i aria-hidden="true"><em style="width:${museumCount(ids,l)*20}%"></em></i></div><div><span>${right}</span><b>${museumCount(ids,r)} / 5</b><i aria-hidden="true"><em style="width:${museumCount(ids,r)*20}%"></em></i></div></div>`).join('')}<p class="museum-note">Ein Exponat kann mehrere Zugänge eröffnen. Die Balken zeigen Gewichtungen, keine Zielwerte.</p></section>`}
function museumIcon(obj){return `<span class="museum-object object-${obj.icon}" aria-hidden="true"><i></i></span>`}
function museumCard(obj,action,chosen,disabled=false){return `<button class="museum-card ${chosen?'chosen':''}" data-museum="${action}" data-object="${obj.id}" aria-pressed="${chosen}" ${disabled?'disabled':''}><span class="museum-cardtop"><span class="museum-inventory">DEPOT ${String(obj.id).padStart(2,'0')}</span>${museumIcon(obj)}</span><strong>${obj.title}</strong><span class="museum-date">${obj.date}</span><span class="museum-description">${obj.text}</span><span class="museum-type">${obj.type}</span>${chosen?`<span class="museum-selected">${action==='pick'?'Für Ausstellung ausgewählt':action==='out'?'Wird ersetzt':'Kommt neu hinzu'}</span>`:''}</button>`}
function museumGallery(ids,interactive=false){const m=state.museum;return `<div class="museum-gallery">${ids.map((id,i)=>{const obj=museumById(id),tag=interactive?'button':'div';return `<${tag} class="museum-vitrine ${interactive&&m.out===id?'leaving':''}" ${interactive?`data-museum="out" data-object="${id}" aria-pressed="${m.out===id}"`:''} style="--delay:${i*45}ms">${museumIcon(obj)}<span class="museum-inventory">DEPOT ${String(id).padStart(2,'0')}</span><strong>${obj.title}</strong>${interactive?`<span>${m.out===id?'Wird ersetzt':'Zum Tauschen wählen'}</span>`:''}</${tag}>`}).join('')}</div>`}
function museumSlots(){const m=state.museum;return `<div class="museum-slots">${Array.from({length:5},(_,i)=>{const obj=museumById(m.selected[i]);return obj?`<button data-museum="pick" data-object="${obj.id}" class="museum-slot filled" aria-label="${obj.title} abwählen">${museumIcon(obj)}<span class="museum-inventory">${String(obj.id).padStart(2,'0')}</span><span class="museum-slotname">${obj.title}</span><span class="museum-slotremove" aria-hidden="true">×</span></button>`:`<div class="museum-slot empty"><span>${String(i+1).padStart(2,'0')}</span><span class="museum-slotname">Freier Platz</span></div>`}).join('')}</div>`}
function museumTeaser(){const completed=!!state.museum?.complete;return `<button class="museum-teaser" data-view="museum"><span class="museum-teaser-icon" aria-hidden="true"><i></i><i></i><i></i></span><span><span class="museum-inventory">Zusatzstation · Museumsdepot</span><strong>Rette die Ausstellung</strong><span>Zwölf Exponate. Fünf Plätze. Welche Geschichte erzählst du?</span></span><b>${completed?'Abgeschlossen':'Depot öffnen ↗'}</b></button>`}
function museumSummary(){return `<div class="statusrow"><span>Rette die Ausstellung</span><span class="${state.museum?.complete?'pill':'unrated'}">${state.museum?.complete?'abgeschlossen':state.museum?.selected?.length?'in Bearbeitung':'noch nicht bearbeitet'}</span></div>`}
let museumMessage='';
function museumView(){const m=state.museum||(state.museum=freshMuseum()),phase=m.phase;return `<section class="museum" aria-labelledby="museum-title"><header class="museum-heading"><div><span class="museum-inventory">Sonderausstellung · Spätantike</span><h2 id="museum-title">Rette die Ausstellung</h2></div><span class="museum-stamp">DEPOT<br>12 / 05</span></header>${phase==='depot'?`<div class="museum-intro"><p>Du leitest eine Sonderausstellung zur sogenannten „Völkerwanderung“. Im Museumsdepot stehen zwölf mögliche Exponate bereit – im Ausstellungsraum ist jedoch nur Platz für fünf.</p><p><strong>Wähle fünf Exponate aus.</strong> Mit deiner Auswahl entscheidest du, was Besucher sehen – und welche Geschichte deine Ausstellung erzählt.</p></div><div class="museum-workbench"><section class="museum-depot" aria-label="Museumsdepot"><div class="museum-sectiontitle"><h3>Das Museumsdepot</h3><span>12 Exponate</span></div><div class="museum-depotgrid">${museumObjects.map(obj=>museumCard(obj,'pick',m.selected.includes(obj.id),m.selected.length===5&&!m.selected.includes(obj.id))).join('')}</div></section><aside class="museum-selection"><h3>Deine Ausstellung</h3><p class="museum-counter" role="status">${m.selected.length} / 5 Exponate ausgewählt</p>${museumSlots()}<p class="museum-note">${m.selected.length===5?'Ausstellung bereit. Zum Ändern wähle zuerst ein Exponat ab.':'Wähle aus, welche Zeugnisse und Bilder im Raum zu sehen sein sollen.'}</p><button data-museum="open" ${m.selected.length===5?'':'disabled'}>Ausstellung eröffnen</button></aside></div>`:phase==='exhibition'?`<div class="museum-scene"><span class="museum-openlabel">Sonderausstellung</span><h3>Deine Ausstellung ist eröffnet.</h3>${museumGallery(m.initial)}</div><h3 class="museum-question">Welche Geschichte erzählt sie?</h3><div class="museum-analysis">${museumObservations(m.initial).map(([h,p])=>`<section><h4>${h}</h4><p>${p}</p></section>`).join('')}</div>${museumProfile(m.initial)}<p class="museum-reflection">Keine Ausstellung kann alles zeigen. Entscheidend ist, sich bewusst zu machen, welche Perspektiven durch Auswahl und Gewichtung stärker sichtbar werden – und welche in den Hintergrund treten.</p><section class="museum-commission"><span class="museum-inventory">Auftrag des Museumsbeirats</span><h3>${museumGoals[m.challenge.key].title}</h3><p>${m.challenge.intro}</p><p><strong>${museumGoals[m.challenge.key].request}</strong></p><h4>Welches Exponat gibst du zurück?</h4>${museumGallery(m.initial,true)}<h4>Welches Exponat kommt hinzu?</h4><div class="museum-replacements">${museumObjects.filter(obj=>!m.initial.includes(obj.id)).map(obj=>museumCard(obj,'in',m.in===obj.id)).join('')}</div><div class="museum-swapline"><span>${m.out?museumById(m.out).title:'Ein Exponat zurückgeben'}</span><b aria-hidden="true">→</b><span>${m.in?museumById(m.in).title:'Ein Exponat ergänzen'}</span></div><button data-museum="update" ${m.out&&m.in?'':'disabled'}>Ausstellung aktualisieren</button><p class="museum-message" role="status">${museumMessage}</p></section>`:`<div class="museum-scene"><span class="museum-openlabel">${m.complete?'Ausstellung abgeschlossen':'Neu eingerichtet'}</span><h3>Deine Ausstellung im Vergleich</h3>${museumGallery(m.selected)}</div><div class="museum-beforeafter">${museumProfile(m.initial,'Vorher')}${museumProfile(m.selected,'Nachher')}</div><section class="museum-change"><h3>Was hat sich verändert?</h3><p><strong>Neu im Raum:</strong> ${museumById(m.in).title}<br><strong>Nicht mehr gezeigt:</strong> ${museumById(m.out).title}</p><p>${museumById(m.in).gain}</p><p class="museum-note">Der beauftragte Zugang ist nun in ${museumCount(m.selected,museumGoals[m.challenge.key].tag)} statt ${museumCount(m.initial,museumGoals[m.challenge.key].tag)} Exponaten vertreten. Auch die neue Auswahl lässt andere Aspekte zurücktreten.</p></section><section class="museum-conclusion"><h3>Was hat das mit Geschichte zu tun?</h3><p>Du hattest zwölf mögliche Exponate – zeigen konntest du nur fünf. Dadurch hast du ausgewählt, gewichtet und andere Aspekte weggelassen.</p><p>Auch historische Darstellungen können die Vergangenheit nicht vollständig abbilden. Sie setzen Schwerpunkte und erzeugen dadurch ein bestimmtes Geschichtsbild.</p><p>Entscheidend ist, <strong>wie begründet, nachvollziehbar und überprüfbar diese Auswahl ist.</strong> Aussagen müssen sich an Quellen und Befunden prüfen lassen.</p>${m.complete?'<p class="museum-complete" role="status">Ausstellung abgeschlossen.</p>':'<button data-museum="finish">Ausstellung abschließen</button>'}</section>`}<div class="endnav museum-end"><button class="secondary" data-view="home">Themenübersicht</button><button class="quiet" data-museum="restart">Neu beginnen</button></div></section>`}
function redrawMuseum(focusTop=false){const scroll=main.querySelector('.museum-depotgrid')?.scrollTop||0,active=document.activeElement,action=active?.dataset?.museum,id=active?.dataset?.object,y=window.scrollY;main.innerHTML=museumView();main.querySelector('.museum').classList.toggle('museum-still',!focusTop);const grid=main.querySelector('.museum-depotgrid');if(grid)grid.scrollTop=scroll;updateProgress();if(focusTop){main.focus({preventScroll:true});main.scrollIntoView({block:'start'})}else{if(action)main.querySelector(`[data-museum="${action}"]${id?`[data-object="${id}"]`:''}`)?.focus({preventScroll:true});window.scrollTo(0,y)}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-museum]');if(!btn||btn.disabled)return;const m=state.museum||(state.museum=freshMuseum()),act=btn.dataset.museum,id=Number(btn.dataset.object);museumMessage='';let top=false;
if(act==='pick'){if(m.phase!=='depot'||!museumById(id))return;if(m.selected.includes(id))m.selected=m.selected.filter(x=>x!==id);else if(m.selected.length<5)m.selected.push(id);else return}
else if(act==='open'){if(m.phase!=='depot'||m.selected.length!==5)return;m.initial=[...m.selected];m.challenge=museumChallenge(m.initial);m.phase='exhibition';top=true}
else if(act==='out'){if(m.phase!=='exhibition'||!m.initial.includes(id))return;m.out=m.out===id?null:id}
else if(act==='in'){if(m.phase!=='exhibition'||m.initial.includes(id)||!museumById(id))return;m.in=m.in===id?null:id}
else if(act==='update'){if(m.phase!=='exhibition'||!m.initial.includes(m.out)||m.initial.includes(m.in)||!museumById(m.in))return;const next=m.initial.filter(x=>x!==m.out).concat(m.in),tag=museumGoals[m.challenge.key].tag;if(museumCount(next,tag)<=museumCount(m.initial,tag)){museumMessage='Dieser Tausch verstärkt den beauftragten Zugang noch nicht. Prüfe, welchen Beitrag beide Exponate zu diesem Schwerpunkt leisten.'}else{m.selected=next;m.phase='compare';top=true}}
else if(act==='finish'){if(m.phase!=='compare'||m.complete)return;m.complete=true}
else if(act==='restart'){state.museum=freshMuseum();top=true}
else return;save();redrawMuseum(top)});

show('home',false);

</script>
</body>
</html>
