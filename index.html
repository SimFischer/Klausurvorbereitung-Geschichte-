margin:16px 0}.exercise .eyebrow{display:block;margin-bottom:10px}.material{background:#f8f6f0;border-left:3px solid #aaa98d;border-radius:0 14px 14px 0;padding:16px 18px;margin:14px 0;font-size:.97rem}.material p:last-child{margin-bottom:0}.material small{color:var(--muted);display:block;margin-top:8px;font:500 .78rem/1.5 Arial,sans-serif}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare .material{margin:0 0 16px}fieldset{border:0;padding:0;margin:14px 0;min-width:0}legend{font-weight:bold;margin-bottom:8px}.option{display:flex;align-items:flex-start;gap:10px;background:#f7f5ee;border:1px solid transparent;padding:12px 14px;margin:8px 0;border-radius:13px;cursor:pointer}.option:has(input:checked){border-color:#73765a;background:#f0f0e4}.option input{margin-top:5px;accent-color:var(--dark);width:18px;height:18px;flex-shrink:0}.matchrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,.7fr);gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #c9c3b5}.matchrow:last-child{border:0}.matchrow label{line-height:1.45}select{width:100%;min-height:44px;padding:9px;background:#fbfaf6;border:1px solid #aaa696;border-radius:10px;color:var(--ink);font-size:.95rem}textarea{display:block;resize:vertical;width:100%;min-height:145px;background:#fffdf8;border:1px solid #aaa696;border-radius:14px;padding:14px;color:var(--ink);line-height:1.6;margin:12px 0;scroll-margin-top:20px}textarea::placeholder{color:#77756d}.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:16px}.feedback,.hint,.review{background:#f8f6ee;border-radius:16px;padding:16px 18px;margin-top:16px;font-size:.95rem}.feedback p:last-child,.hint p:last-child{margin-bottom:0}.good{color:var(--good)}.warn{color:var(--warn)}.feedback ul{list-style:none;padding:0;margin:8px 0}.feedback li{margin:7px 0}.review .option{background:#eeece3;font-size:.9rem}.hint .micro{display:block;margin-bottom:6px}.endnav{display:flex;justify-content:space-between;flex-wrap: <body>
<div class="wrap">
<aside class="spine" aria-hidden="true"><span>GESCHICHTE · VERGANGENHEIT · DARSTELLUNG</span></aside>
<header><h1>Klausurvorbereitung Geschichte</h1><p class="subtitle">Was ist Geschichte? · Geschichtsbilder · Völkerwanderung · historisches Urteilen</p></header>
<div class="topline"><progress id="progress" max="100" value="0" aria-label="Fortschritt"></progress><label id="progressText" for="progress">Fortschritt: 0 %</label></div>
<nav class="nav" aria-label="Navigation"><button data-view="home">Themen</button><button data-view="summary">Dein Lernstand</button><a class="button quiet" href="https://denkwerk-kronwerk.vercel.app/" target="_blank" rel="noopener noreferrer">Denkwerk ↗</a></nav>
<main id="main" tabindex="-1"></main>
<footer class="footer"><span>Geschichte · E-Jahrgang</span><button id="reset" class="quiet">Fortschritt zurücksetzen</button></footer>
<div id="resetbox" class="resetbox" hidden><p>Alle Antworten und den Lernstand zurücksetzen?</p><div class="actions"><button id="confirmReset">Zurücksetzen</button><button id="cancelReset" class="secondary">Abbrechen</button></div></div>
<p id="savewarn" class="savewarn" role="status" hidden>Dein Fortschritt kann gerade nicht gespeichert werden.</p>
</div>
<script>
'use strict';
const PDF='https://denkwerk-kronwerk.vercel.app/lernzettel/geschichte-aussage-beurteilen.pdf';
const areas=['Quellen & Darstellungen','Perspektivität','Geschichtsbilder','Völkerwanderung','Westrom','Herausarbeiten','Erläutern','Beurteilen'];
const topics=[
{title:'Vergangenheit – Quelle – Darstellung',desc:'Zeugnisse zuordnen. Grenzfälle begründen.',recap:['Vergangenheit umfasst tatsächliche vergangene Ereignisse. Sie ist nicht unmittelbar zugänglich.','Quellen sind Überreste oder Zeugnisse der Vergangenheit. Ihr Erkenntniswert hängt von der Frage ab.','Darstellungen entstehen später durch Auswahl, Ordnung und Deutung.','Dasselbe Material kann je nach Fragestellung Quelle oder Darstellung sein.']},
{title:'Historische Darstellungen',desc:'Auswahl, Perspektive und Wirkung vergleichen.',recap:['Darstellungen wählen aus, gewichten, deuten und lassen aus.','Perspektiven hängen unter anderem von Fragestellung, Standort und Entstehungszeit ab.','Unterschiedliche Perspektiven sind nicht automatisch falsch. Aussagen müssen sich an Belegen prüfen lassen.']},
{title:'Quellen prüfen',desc:'Aussagewert und Grenzen bestimmen.',recap:['Frage nach Verfasser, Zeitpunkt, Adressat und Absicht.','Unterscheide Beobachtung, Behauptung und Wertung.','Prüfe Perspektive, Aussagewert und Grenzen anhand der konkreten Fragestellung.','Einseitige Quellen sind nicht wertlos: Sie können Einstellungen und Interessen zeigen.']},
{title:'Geschichtsbilder & Geschichtskultur',desc:'Inszenierungen und Gegenwartsbezüge untersuchen.',recap:['Geschichtsbilder verdichten Vorstellungen von Vergangenheit.','Filme, Memes, Denkmäler und digitale Bilder gehören zur Geschichtskultur.','Auswahl und Inszenierung können gegenwärtige Interessen ausdrücken.','Überzeugungskraft beruht auch auf Quellenbezug, Kontext und Überprüfbarkeit.']},
{title:'Die sogenannte „Völkerwanderung“',desc:'Begriffe prüfen. Wandelbare Verbände verstehen.',recap:['„Völkerwanderung“ ist ein problematischer Sammelbegriff für unterschiedliche Vorgänge der Spätantike.','Es wanderten keine unveränderlichen, homogenen und geschlossenen „Völker“. Verbände konnten sich neu bilden und verändern.','Migration, Flucht, militärische Bewegung und Ansiedlung sind zu unterscheiden.','Rom und zugewanderte Gruppen kooperierten und gerieten in Konflikt; Integration verlief unterschiedlich.']},
{title:'Ende des Weströmischen Reiches',desc:'Faktoren verknüpfen. Entwicklungen erklären.',recap:['Adrianopel 378 betraf das oströmische Heer; Rom 410 war ein schwerer symbolischer und politischer Einschnitt. Beide Ereignisse erklären Westroms Ende nicht allein.','Gebietsverluste, sinkende Steuereinnahmen und Rekrutierungsprobleme konnten einander verstärken.','Schwache Kaiser, mächtige Heermeister, Bürgerkriege und politische Konkurrenz erschwerten die Stabilisierung.','Föderaten waren vertraglich gebundene Gruppen, die militärische Dienste leisteten. Kooperation und Konflikt wechselten.','476 endete das weströmische Kaisertum; römische Strukturen bestanden weiter. Es gibt keine hier vorgegebene Hauptursache.']},
{title:'Operatoren',desc:'Herausarbeiten. Erläutern. Beurteilen.',recap:['Herausarbeiten: zentrale Position und Begründungen textnah wiedergeben; keine eigene Meinung.','Erläutern: Material durch Fachwissen verständlich machen und Zusammenhänge erklären.','Beurteilen: Aussage klären, Teilaussagen prüfen, Argumente belegen, gewichten und ein Sachurteil formulieren.']},
{title:'Gemischte Wiederholung',desc:'Sechs Fälle. Begriffe und Belege verbinden.',recap:['Nutze Fachbegriffe präzise und beziehe dich auf das Material.','Unterscheide unterschiedliche Perspektiven von unbelegten oder widerlegten Behauptungen.','Begründe Einordnungen; prüfe Aussagewert und Grenzen.']}
];
const tasks=[];
function add(t,a,type,title,body,data,hints){tasks.push({id:'q'+tasks.length,t,a,type,title,body,...data,hints});}
const mat=(text,credit='Fiktives Material')=>`<div class="material"><p>${text}</p><small>${credit}</small></div>`;
const pair=(a,b)=>`<div class="compare">${mat(a,'Darstellung A · fiktiv')}${mat(b,'Darstellung B · fiktiv')}</div>`;
function match(t,a,title,body,opts,rows,hints){add(t,a,'match',title,body,{opts,rows},hints)}
function choice(t,a,title,body,opts,correct,explain,hints){add(t,a,'choice',title,body,{opts,correct,explain},hints)}
function free(t,a,title,body,criteria,hints){add(t,a,'free',title,body,{criteria},hints)}
const srcHints=['Frage nach dem Zeitpunkt und der historischen Frage.','Unterscheide das Ereignis selbst von einem Zeugnis und einer späteren Deutung.','Prüfe bei einem Grenzfall zwei verschiedene Untersuchungsfragen.'];
match(0,0,'Ordne zu.','Welche Kategorie passt zur jeweils genannten Frage?',['Vergangenheit','Quelle','Darstellung'],[
['Ein Brief von 1916 als Zeugnis der damaligen Kriegserfahrung',1,'Der zeitgenössische Brief ist ein Zeugnis einer bestimmten Person.'],['Eine römische Münze als Zeugnis kaiserlicher Selbstdarstellung',1,'Die Münze ist ein materieller Überrest.'],['Ein Tagebuch von 1945 als Zeugnis damaliger Alltagserfahrungen',1,'Das zeitgenössische Tagebuch bezeugt eine persönliche Perspektive.'],['Ein heutiger Dokumentarfilm als Erklärung des Ersten Weltkriegs',2,'Der spätere Film wählt Material aus und deutet es.'],['Ein heutiges Geschichtsschulbuch über das Römische Reich',2,'Das Schulbuch ordnet und deutet vergangene Entwicklungen.'],['Eine Karte von 2024, die Wanderungsbewegungen der Spätantike rekonstruiert',2,'Die spätere Rekonstruktion ist eine Darstellung.'],['Der tatsächliche Ausbruch des Vesuvs im Jahr 79',0,'Das Ereignis selbst gehört zur Vergangenheit.']],srcHints);
free(0,0,'Quelle, Darstellung oder beides? Begründe.',mat('Ein Spielfilm von 1960 über den Zweiten Weltkrieg.'),['Ich unterscheide die erzählte Kriegszeit von der Entstehungszeit 1960.','Ich nenne eine Frage, für die der Film eine Darstellung ist.','Ich nenne eine Frage, für die der Film eine Quelle ist.','Ich begründe die Unterscheidung am Film.'],srcHints);
free(0,0,'Eine historische Karte – ein eindeutiger Fall?',mat('Eine im Jahr 1812 gedruckte Karte zeigt die damaligen Grenzen Europas.')+'Erkläre den Erkenntniswert für die Untersuchung damaliger Raumvorstellungen. Welche Grenzen bleiben?',['Ich ordne die Karte mit Bezug auf die Untersuchungsfrage ein.','Ich berücksichtige Auswahl oder Perspektive des Kartenherstellers.','Ich unterscheide damalige Grenzdarstellung und tatsächliche Verhältnisse.'],['Auch Karten beruhen auf Entscheidungen.','Frage nach Auftrag, Zweck und dargestelltem Raum.','Beziehe Grenzen, Auslassungen und den Entstehungszeitpunkt ein.']);
const compareRome=pair('Im Jahr 410 plünderten Alarichs Truppen Rom. Für die Menschen der Stadt bedeutete dies Gewalt, Verlust und Unsicherheit.','Die Plünderung Roms 410 erschütterte das Ansehen des Reiches. Verwaltung und Herrschaft bestanden dennoch in vielen Regionen weiter.');
free(1,1,'Vergleiche zwei Darstellungen.',compareRome+'Arbeite Perspektive, Hervorgehobenes und Ausgelassenes heraus. Beschreibe die jeweilige Wirkung.',['Ich benenne die unterschiedlichen Schwerpunkte beider Texte.','Ich zeige an Formulierungen, was jeweils hervorgehoben wird.','Ich benenne mindestens eine Auslassung.','Ich erkläre, wie die Auswahl die Wirkung verändert.'],['Beide Texte behandeln dasselbe Ereignis.','Vergleiche die Menschen vor Ort mit der Entwicklung des Reiches.','Achte auf „Gewalt, Verlust“ und „bestanden dennoch“. Welche Erwartungen erzeugt das?']);
choice(1,1,'Unterschiedlich heißt falsch?',compareRome,['A ist falsch, weil B die Fortdauer betont.','Beide können begründete Teilperspektiven bieten; ihre Aussagen sind an Belegen zu prüfen.','Beide sind gleich überzeugend, weil jede Darstellung subjektiv ist.'],1,'Eine Perspektive ist kein Freibrief: Belegbarkeit und Kontext bleiben entscheidend.',['Unterscheide Ergänzung und Widerspruch.','Prüfe, ob sich die Aussagen gegenseitig ausschließen.','Vergleiche Perspektive und empirische Belegbarkeit.']);
match(1,1,'Wie entsteht eine Darstellung?','Ordne den Eingriff zu.',['Auswahl','Gewichtung','Perspektivität','Deutung','Auslassung'],[['Eine Autorin verwendet nur Briefe und Münzen aus einem großen Quellenbestand.',0,'Die Materialgrundlage wird ausgewählt.'],['Ein Film widmet der Schlacht 20 Minuten, der Versorgungslage eine Minute.',1,'Die Länge setzt unterschiedliche Schwerpunkte.'],['Ein Text schildert eine Eroberung aus Sicht der Stadtbevölkerung.',2,'Der Standort der Betrachtung prägt den Blick.'],['Ein Autor erklärt die Reform als Versuch, die Herrschaft zu sichern.',3,'Dem Vorgang wird ein erklärender Sinn zugeordnet.'],['Ein Überblick erwähnt die betroffene Landbevölkerung überhaupt nicht.',4,'Eine Gruppe bleibt unberücksichtigt.']],['Achte auf das jeweils ausdrücklich beschriebene Verfahren.','Material wählen, Raum verteilen und etwas ganz weglassen sind unterscheidbar.','Perspektivität betrifft den Blickwinkel; Deutung erklärt eine Bedeutung oder einen Zusammenhang.']);
const source1=mat('„Diese Fremden sind an jedem Unglück schuld! Nur wenn ihr meinem Vorschlag folgt und sie aus der Stadt weist, kann unsere Stadt gerettet werden.“','Fiktive Rede eines Stadtrats an die Stadtversammlung, 412; der Stadtrat wirbt für seine Politik.');
match(2,0,'Prüfe die Herkunft.',source1,['Stadtrat','412','Stadtversammlung','Zustimmung zur Ausweisung gewinnen'],[['Verfasser',0,'Die Rede stammt vom Stadtrat.'],['Zeitpunkt',1,'Als Entstehungsjahr ist 412 angegeben.'],['Adressat',2,'Angesprochen wird die Stadtversammlung.'],['Absicht',3,'Der Redner wirbt für seinen politischen Vorschlag.']],['Nutze die Angaben unter der Rede.','Trenne die sprechende Person von ihrem Publikum.','Achte bei der Absicht auf „Nur wenn ihr meinem Vorschlag folgt“.']);
choice(2,0,'Was lässt sich daraus tatsächlich ableiten?',source1,['Die Zugewanderten waren nachweislich an jedem Unglück schuld.','Alle Bewohner der Stadt teilten die Meinung des Stadtrats.','Der Stadtrat stellte Zugewanderte als Gefahr dar und warb für eine Ausweisung.','Die Quelle ist wegen ihrer Einseitigkeit wertlos.'],2,'Die Rede belegt eine politische Zuschreibung. Einseitige Quellen können Einstellungen und Interessen zeigen.',['Unterscheide eine Behauptung von ihrem Nachweis.','Die Rede zeigt sicher, wie der Redner überzeugen will.','Über die tatsächlichen Ursachen des Unglücks und die Meinung aller Bewohner fehlen unabhängige Belege.']);
free(2,0,'Bestimme Aussagewert und Grenzen.',source1+'Erkläre Perspektive und Absicht. Was müsste zusätzlich geprüft werden?',['Ich belege die starke Wertung mit einer Formulierung.','Ich verbinde die Perspektive des Stadtrats mit seiner Absicht.','Ich unterscheide seine Behauptung von nachgewiesenen Vorgängen.','Ich nenne weitere Quellen für eine Überprüfung.'],['Wer profitiert davon, wenn das Publikum zustimmt?','Prüfe „an jedem Unglück“ und „nur wenn“.','Unterscheide Einstellungen, tatsächliches Verhalten und mögliche Gegenstimmen.']);
free(2,0,'Zwei Quellen – zwei Grenzen.',mat('„Heute kamen zwölf neue Familien ins Dorf. Der Rat teilte ihnen Felder zu. Ob sie bleiben, weiß ich nicht.“','Fiktiver privater Brief einer Dorfbewohnerin an ihre Schwester, 430.')+'Vergleiche den Aussagewert dieses Briefs mit der Rede des Stadtrats.',['Ich berücksichtige Verfasserin, Zeitpunkt und Adressatin des Briefs.','Ich unterscheide private Mitteilung und öffentliche Überzeugungsabsicht.','Ich benenne eine konkrete Information und eine Grenze des Briefs.','Ich vermeide eine Verallgemeinerung auf alle Ansiedlungen.'],['Auch eine private Quelle hat einen begrenzten Blick.','Was hat die Briefschreiberin beobachtet, was weiß sie ausdrücklich nicht?','Vergleiche Ortsbezug, Publikum und Aussageabsicht.']);
match(3,2,'Geschichtskultur im Alltag','Welcher Aspekt steht im Vordergrund?',['Auswahl','Inszenierung','Gegenwartsbezug','Überprüfbarkeit'],[['Eine Wikinger-Serie zeigt fast nur Kämpfe; Handel und Landwirtschaft fehlen.',0,'Die Auswahl verengt das Wikingerbild.'],['Ein Napoleon-Denkmal stellt den Herrscher erhöht, übergroß und im Triumph dar.',1,'Größe und Anordnung inszenieren Überlegenheit.'],['Ein Mittelalter-Meme kommentiert eine heutige politische Debatte.',2,'Vergangenheit dient einer gegenwärtigen Aussage.'],['Ein digital erzeugtes „Foto von 1450“ nennt weder Vorlage noch Belege.',3,'Für den behaupteten historischen Befund fehlen überprüfbare Nachweise.']],['Frage, wie Vergangenheit jeweils sichtbar gemacht wird.','Unterscheide die Wirkung der Gestaltung von ihrer heutigen Verwendung.','Ein glaubwürdig wirkendes Bild ersetzt keinen Beleg.']);
free(3,2,'Unterschiedlich überzeugend?',pair('Eine Ausstellung über Wikinger zeigt Waffen, Handelswaagen und Siedlungsfunde. Fundorte und Datierungen sind angegeben.','Ein Plakat zeigt ausschließlich gehörnte Helme und brennende Dörfer. Es wirbt mit „So waren alle Wikinger!“')+'Können zwei unterschiedliche Darstellungen unterschiedlich überzeugend sein? Begründe.',['Ich vergleiche Auswahl und Inszenierung beider Darstellungen.','Ich prüfe Quellenbezug und Überprüfbarkeit.','Ich hinterfrage die pauschale Aussage des Plakats.','Ich begründe die unterschiedliche Überzeugungskraft an Kriterien.'],['Unterschiedliche Perspektiven sind möglich; beliebige Behauptungen folgen daraus nicht.','Vergleiche die angegebenen Belege mit dem Anspruch „alle“.','Prüfe Vielfalt, Nachweise und das Verhältnis von Aussage und Beleg.']);
free(3,2,'Napoleon auf einem heutigen Denkmal',mat('Eine Stadt errichtet heute eine Napoleon-Statue. Die Inschrift lautet: „Er brachte Ordnung und Fortschritt.“ Kriege und Besatzung bleiben unerwähnt.')+'Untersuche das Geschichtsbild und seinen Gegenwartsbezug.',['Ich zeige Auswahl und Auslassung an der Inschrift.','Ich beschreibe die positive Inszenierung.','Ich formuliere eine begründete Frage nach heutigen Interessen.','Ich unterscheide heutiges Erinnern von damaligem Geschehen.'],['Ein Denkmal sagt auch etwas über die Zeit seiner Errichtung aus.','Welche Eigenschaften werden geehrt und welche Erfahrungen fehlen?','Beziehe Auftraggeber, Standort oder Anlass als zu prüfende Aspekte ein.']);
match(4,3,'Aussagen prüfen','Ordne jeweils die am besten passende Bewertung zu.',['zutreffend','zu vereinfachend','problematisch'],[['„Geschlossene, unveränderliche Völker wanderten gemeinsam durch Europa.“',2,'Die Aussage setzt homogene und unveränderliche Völker voraus.'],['„Unter dem Begriff werden sehr unterschiedliche Vorgänge zusammengefasst.“',0,'Der Sammelbegriff bündelt unterschiedliche Prozesse.'],['„Verbände konnten sich im Laufe der Zeit verändern.“',0,'Zugehörigkeiten und Zusammensetzungen waren wandelbar.'],['„Die Bewegungen waren vor allem eine Suche nach einem neuen Wohnort.“',1,'Das reduziert unterschiedliche Motive und Formen auf einen Schwerpunkt.'],['„Mit Rom gab es ausschließlich Konflikte.“',2,'Verträge, militärische Dienste und Kooperation werden ausgeschlossen.']],['Prüfe besonders Wörter wie „unveränderlich“ und „ausschließlich“.','Eine Schwerpunktsetzung kann verkürzen; eine absolute Behauptung kann dem Wissen widersprechen.','Berücksichtige Wandel, verschiedene Motive und Beziehungen zu Rom.']);
free(4,3,'Begriffe erzeugen Erwartungen.',pair('„Einfall der Barbaren“','„Migration und Transformation im spätantiken Europa“')+'Welche Perspektive erzeugt die Bezeichnung? Welche Erwartungen und Wertungen entstehen?',['Ich untersuche die römisch geprägte Fremdbezeichnung „Barbaren“.','Ich erläutere die Wirkung von „Einfall“.','Ich erkläre den Fokus von „Migration und Transformation“.','Ich prüfe auch beim zweiten Begriff, was in den Hintergrund geraten kann.'],['Bezeichnungen lenken bereits vor der Erklärung den Blick.','Vergleiche Bedrohung und Gewalt mit Bewegung und Wandel.','Frage, ob der zweite Begriff konkrete Konflikte zu wenig sichtbar machen könnte.']);
match(4,3,'Vorgänge unterscheiden','Wähle den im Fall ausdrücklich erkennbaren Vorgang.',['Flucht','militärische Bewegung','Ansiedlung','Kooperation mit Rom'],[['Familien verlassen ein Gebiet, weil sie bewaffnete Angriffe fürchten.',0,'Bedrohung ist hier das ausdrücklich genannte Motiv.'],['Ein bewaffneter Verband zieht mit dem Ziel eines Feldzugs weiter.',1,'Im Mittelpunkt steht eine militärische Operation.'],['Eine Gruppe erhält Land und richtet dauerhaft Wohnorte ein.',2,'Landvergabe und dauerhafte Wohnorte kennzeichnen Ansiedlung.'],['Ein Verband verpflichtet sich vertraglich zum Heeresdienst für Rom.',3,'Der Vertrag begründet militärische Zusammenarbeit.']],['Achte auf das genannte Ziel und die Handlung.','Bedrohung, Feldzug, dauerhafter Wohnort und Vertrag unterscheiden sich.','Vorgänge können sich historisch überschneiden; ordne hier nach dem ausdrücklich genannten Schwerpunkt.']);
free(4,3,'Wandelbare Verbände',mat('Ein Verband nimmt nach einer Niederlage neue Kämpfer und Familien auf. Jahre später dient ein Teil im römischen Heer; ein anderer Teil schließt sich einem neuen Anführer an.','Fiktiver Fall zur Spätantike')+'Warum passt die Vorstellung eines geschlossenen „Volkes“ hier nicht?',['Ich belege Veränderungen der Zusammensetzung am Fall.','Ich unterscheide politische oder militärische Zugehörigkeit von einer festen Abstammungsgemeinschaft.','Ich beziehe Kooperation und wechselnde Führung ein.'],['Was verändert sich zwischen Anfang und Ende?','Achte auf Aufnahme, Aufteilung und den Wechsel von Bindungen.','Erkläre Zugehörigkeit als veränderlich; vermeide eine Gleichsetzung mit heutigen Nationen.']);
match(5,4,'Faktoren ordnen','Wähle die im Wortlaut vorrangige Ebene. Begründe mögliche Überschneidungen für dich.',['äußerer Faktor','innerer Faktor','Wechselwirkung'],[['Angriffe bewaffneter Gruppen von außerhalb des Reiches',0,'Hier steht der von außen kommende Konflikt im Vordergrund.'],['Bürgerkriege und Konkurrenz um den Kaiserthron',1,'Politische Konkurrenz liegt innerhalb des Reiches.'],['Gebietsverluste senken Steuereinnahmen und erschweren die Heeresfinanzierung.',2,'Territoriale, finanzielle und militärische Prozesse greifen ineinander.'],['Heermeister setzen schwache Kaiser unter Druck.',1,'Die Machtverteilung innerhalb der Führung steht im Mittelpunkt.'],['Rekrutierungsprobleme fördern Abhängigkeiten von Föderaten; Konflikte gefährden die Kooperation.',2,'Innere Probleme und Beziehungen zu verbündeten Gruppen beeinflussen sich.']],['Unterscheide den Ausgangspunkt eines Faktors und seine Folgen.','Bei verknüpften Prozessen ist „Wechselwirkung“ oft die passende Ebene.','Die Zuordnung bezieht sich auf die Formulierung; Faktoren können mehrere Ebenen berühren.']);
match(5,4,'Einschnitte einordnen','Welche Aussage passt?',['Adrianopel 378','Rom 410','476'],[['Niederlage des oströmischen Heeres; Kaiser Valens fällt.',0,'Adrianopel betrifft 378 das östliche Reich.'],['Alarichs Truppen plündern Rom.',1,'Die Plünderung von 410 war auch ein symbolischer Einschnitt.'],['Absetzung des Romulus Augustulus; römische Strukturen bestehen weiter.',2,'476 markiert das Ende des weströmischen Kaisertums, keinen vollständigen Strukturbruch.']],['Ordne zunächst die Ereignisse zeitlich.','Unterscheide die Niederlage im Osten von der Plünderung Roms.','Ein politisches Enddatum bedeutet nicht das Ende aller römischen Lebensformen.']);
free(5,4,'Welche Faktoren hängen besonders eng zusammen?',mat('Gebietsverluste · sinkende Steuereinnahmen · Rekrutierungsprobleme · Bürgerkriege · schwache Kaiser · Heermeister · äußere Konflikte · Föderaten')+'Erkläre zwei Verknüpfungen. Zeige dabei eine mögliche Rückwirkung.',['Ich erkläre mindestens zwei Beziehungen zwischen konkreten Faktoren.','Ich erläutere, wie ein Faktor einen anderen beeinflussen konnte.','Ich zeige eine Rückwirkung oder einen sich verstärkenden Kreislauf.','Ich unterscheide plausible Zusammenhänge von einer zwangsläufigen Entwicklung.'],['Beginne mit einem Faktor und frage nach seinen Folgen.','Was bedeuten geringere Einnahmen für ein Heer? Was bedeutet ein geschwächtes Heer für die Gebiete?','Berücksichtige auch politische Konkurrenz und die Bedingungen militärischer Kooperation.']);
free(5,4,'Warum reicht eine einzelne Ursache nicht aus?','Erkläre das Ende Westroms multifaktorial. Berücksichtige auch das Fortleben römischer Strukturen nach 476.',['Ich verbinde innere und äußere Faktoren.','Ich erkläre Wechselwirkungen statt nur Ursachen aufzuzählen.','Ich unterscheide einzelne Ereignisse von längerfristigen Entwicklungen.','Ich berücksichtige Kontinuitäten nach 476.'],['Eine Liste ersetzt noch keine Erklärung.','Verknüpfe politische, militärische und wirtschaftliche Entwicklungen.','Prüfe, was 476 endete und was in Verwaltung, Recht oder Alltag fortbestand.']);
const expert=mat('Die Bezeichnung „Völkerwanderung“ verdeckt häufig mehr, als sie erklärt. Erstens wandelte sich die Zusammensetzung vieler Verbände durch Aufnahme und Abspaltung. Zweitens reichten ihre Beziehungen zu Rom von vertraglicher Zusammenarbeit bis zum bewaffneten Konflikt. Deshalb sollten konkrete Akteure und Vorgänge untersucht werden, statt einheitliche Wanderungen geschlossener Völker anzunehmen.','Fiktiver Fachtext');

free(6,6,'Erläutern',mat('„Mit dem Verlust von Provinzen schrumpften die Mittel, mit denen die weströmische Führung ihre Truppen unterhalten konnte.“','Fiktiver Fachtext')+'Erläutere den Zusammenhang mithilfe deines Vorwissens.',['Ich erkläre den Zusammenhang zwischen Provinzen, Steuern und Heeresfinanzierung.','Ich verwende passende Fachbegriffe.','Ich verbinde das Material mit weiterem Wissen, etwa Rekrutierung oder politischer Konkurrenz.','Ich erkläre eine Folge und paraphrasiere nicht nur den Satz.'],['Welche Einnahmen bezog die Führung aus den Provinzen?','Verknüpfe Steuereinnahmen mit Versorgung und Finanzierung des Heeres.','Beziehe eine mögliche Rückwirkung auf Gebietssicherung oder militärische Abhängigkeiten ein.']);
match(6,7,'Beurteilen: Schritte ordnen','Ordne jedem Schritt seine Position zu.',['1','2','3','4','5'],[['Argumente mit Material und Fachwissen belegen',2,'Auf die Prüfung folgen belegte Argumente.'],['Sachurteil formulieren',4,'Das Sachurteil schließt die begründete Prüfung ab.'],['Aussage klären',0,'Zuerst wird bestimmt, was die Aussage behauptet.'],['Argumente gewichten',3,'Vor dem Urteil wird die Tragweite der Argumente abgewogen.'],['Teilaussagen prüfen',1,'Die geklärte Aussage wird in prüfbare Teile zerlegt.']],['Beginne mit dem Verständnis der Aussage.','Belege müssen vor ihrer Gewichtung vorliegen.','Das Sachurteil steht am Ende einer nachvollziehbaren Prüfung.']);
choice(6,7,'Welcher Beleg trägt?',mat('Aussage: „Die Zusammensetzung spätantiker Verbände konnte sich verändern.“'),['„Das klingt für mich wahrscheinlich.“','„Eine Serie zeigt wechselnde Anführer, also war es überall so.“','„Für den untersuchten Verband dokumentieren zeitgenössische Berichte die Aufnahme neuer Gruppen; die Überlieferung ist kritisch zu prüfen.“'],2,'Der Beleg ist konkret, prüfbar und in seiner Reichweite begrenzt.',['Ein Beleg muss mehr leisten als Zustimmung.','Achte auf konkrete Nachweise und die Reichweite der Folgerung.','Ein einzelner Fall trägt keine unbegrenzte Verallgemeinerung.']);
choice(6,7,'Welches Sachurteil ist stärker?',mat('Zu prüfen: „476 verschwanden alle römischen Strukturen im Westen.“'),['„Die Aussage ist falsch, denn ich mag die römische Geschichte.“','„Die Aussage ist zu pauschal: Das weströmische Kaisertum endete, während etwa römisches Recht und Teile der Verwaltung regional weiterwirkten. Politischer Bruch und strukturelle Kontinuität sind zu unterscheiden.“','„Die Aussage stimmt, weil jedes Reich irgendwann untergeht.“'],1,'Das Urteil prüft den Geltungsanspruch, nennt Fachwissen und unterscheidet Bruch und Kontinuität.',['Prüfe die Begründung statt die Länge.','Welche Antwort untersucht ausdrücklich das Wort „alle“?','Ein tragfähiges Sachurteil bindet das Ergebnis an nachvollziehbare Kriterien und Belege.']);
free(7,1,'„Entdeckung Amerikas“',mat('Ein Schulbuchkapitel trägt die Überschrift „Die Entdeckung Amerikas 1492“.')+'Welche Perspektive steckt bereits in dieser Bezeichnung? Begründe eine mögliche andere Schwerpunktsetzung.',['Ich erkenne den europäischen Blickwinkel.','Ich berücksichtige die bereits in Amerika lebenden Gesellschaften.','Ich erkläre die Wirkung der Bezeichnung.','Ich begründe eine alternative Schwerpunktsetzung.'],['Für wen war das Gebiet unbekannt?','Prüfe, wessen Erfahrungen das Wort „Entdeckung“ voraussetzt.','Beziehe Begegnung, Eroberung oder bestehende Gesellschaften als mögliche Schwerpunkte ein.']);
free(7,1,'Zwei Darstellungen – wie prüfen?',pair('Eine Ausstellung von 1920 zeigt die Spätantike unter der Überschrift „Untergang durch fremde Völker“.','Eine heutige Ausstellung betont unter „Wandel in der Spätantike“ Migration, Verträge und das Weiterbestehen römischer Strukturen.')+'Warum unterscheiden sie sich und wie kann geprüft werden, welche überzeugender ist?',['Ich berücksichtige Entstehungszeit und Fragestellung.','Ich vergleiche Auswahl, Perspektive und Deutung.','Ich nenne Kriterien wie Quellenbezug, Kontext und Gegenbelege.','Ich setze „neuer“ nicht automatisch mit „richtiger“ gleich.'],['Vergleiche nicht nur die Überschriften.','Frage nach Zeitumständen, Ausstellungsmaterial und Belegen.','Prüfe Reichweite, Auslassungen und den Umgang mit widersprechenden Befunden.']);

free(7,0,'Quelle und Darstellung verbinden',mat('A: Ein fiktiver Brief von 430 berichtet von der Zuteilung von Feldern an zwölf zugewanderte Familien.<br>B: Ein heutiger Fachtext vergleicht mehrere Briefe und archäologische Befunde, um Ansiedlungen zu erklären.','Fiktives Material')+'Unterscheide Quelle und Darstellung. Erkläre ihren jeweiligen Erkenntniswert und eine Grenze.',['Ich ordne A und B mit Bezug auf die Fragestellung ein.','Ich benenne den konkreten und perspektivisch begrenzten Aussagewert des Briefs.','Ich erkläre den vergleichenden und deutenden Zugriff des Fachtexts.','Ich nenne eine Grenze der Darstellung.'],['A und B stehen in einem unterschiedlichen zeitlichen Verhältnis zum Geschehen.','Vergleiche Einzelbeobachtung und spätere Zusammenführung.','Auch die spätere Erklärung hängt von Quellenauswahl und Deutung ab.']);
free(7,4,'Eine Münze nach 476',mat('In einer Region wird nach 476 weiterhin eine Münze mit römischer Bildsprache verwendet. Ein Kommentar folgert: „Also änderte sich 476 überhaupt nichts.“','Fiktiver Fall')+'Prüfe die Reichweite des Belegs. Welche weitere Information wäre nötig?',['Ich erkenne einen Hinweis auf Kontinuität.','Ich begrenze die Aussagekraft des einzelnen Befunds.','Ich unterscheide Bildsprache, Münzgebrauch und politische Herrschaft.','Ich nenne weitere benötigte Belege.'],['Ein Befund kann Kontinuität zeigen, ohne jeden Wandel auszuschließen.','Welche Ebene zeigt die Münze unmittelbar?','Frage zusätzlich nach Datierung, Fundkontext, Herrschaft und Verwaltung.']);

const KEY='geschichte-e-lernstand-v1',main=document.querySelector('#main');
let state={answers:{},results:{},hints:{}},view='home';
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'&&s.answers&&s.results&&s.hints)state=s}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const answer=q=>state.answers[q.id]||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.querySelector('#savewarn').hidden=true}catch(e){document.querySelector('#savewarn').hidden=false}}
function done(q){return Object.hasOwn(state.results,q.id)}
function updateProgress(){const p=Math.round(tasks.filter(done).length/tasks.length*100);document.querySelector('#progress').value=p;document.querySelector('#progressText').textContent=`Fortschritt: ${p} %`}
function links(){return `<aside class="denkwerk"><span class="eyebrow">Beurteilen</span><h3>Urteil ausführlich üben</h3><p>Schreibe deine eigene Beurteilung im Denkwerk.</p><div class="actions"><a class="button" href="https://denkwerk-kronwerk.vercel.app/" target="_blank" rel="noopener noreferrer">Denkwerk öffnen ↗</a><a class="button secondary" href="${PDF}" target="_blank" rel="noopener noreferrer">Denkzettel ansehen ↗</a></div></aside>`}
function home(){return `<p class="intro">Wähle ein Thema aus.</p><div class="grid">${topics.map((t,i)=>{const qs=tasks.filter(q=>q.t===i),n=qs.filter(done).length;return `<button class="topic" data-view="${i}"><span class="num">Thema ${String(i+1).padStart(2,'0')}</span><h3>${t.title}</h3><span class="desc">${t.desc}</span><span class="foot"><span>${n} / ${qs.length} bearbeitet</span><b aria-hidden="true">↗</b></span></button>`}).join('')}</div>`}
function summary(){const rated=tasks.filter(done);return `<h2>Dein Lernstand</h2>${rated.length?'<p>Nach deinen Antworten und Kriterienprüfungen.</p>':'<p class="empty">Bearbeite eine Aufgabe, um deinen Lernstand einzusehen.</p>'}${areas.map((a,i)=>{const qs=rated.filter(q=>q.a===i);if(!qs.length)return `<div class="statusrow"><span>${a}</span><span class="unrated">noch nicht bearbeitet</span></div>`;const score=qs.reduce((s,q)=>s+state.results[q.id].score,0)/qs.length;return `<div class="statusrow"><span>${a}<br><small class="micro">${qs.length} / ${tasks.filter(q=>q.a===i).length} bearbeitet</small></span><span class="pill ${score<.6?'warn':''}">${score>=.85?'sicher':score>=.6?'weitgehend sicher':'noch üben'}</span></div>`}).join('')}${links()}<div class="actions"><button data-view="home">Wähle ein Thema.</button></div>`}
function controls(q){const a=answer(q);if(q.type==='choice')return `<fieldset><legend class="micro">Wähle eine Antwort.</legend>${q.opts.map((x,i)=>`<label class="option"><input type="radio" name="${q.id}" data-answer="pick" value="${i}" ${a.pick===String(i)?'checked':''}><span>${x}</span></label>`).join('')}</fieldset>`;if(q.type==='match')return q.rows.map((r,i)=>`<div class="matchrow"><label for="${q.id}-${i}">${r[0]}</label><select id="${q.id}-${i}" data-answer="${i}"><option value="">Wählen …</option>${q.opts.map((x,j)=>`<option value="${j}" ${a[i]===String(j)?'selected':''}>${x}</option>`).join('')}</select></div>`).join('');return `<label class="micro" for="${q.id}-text">Deine Antwort</label><textarea id="${q.id}-text" data-answer="text" maxlength="6000" placeholder="Begründe mit Material und Fachwissen.">${esc(a.text||'')}</textarea>`}
function review(q){const a=answer(q);return `<div class="review" ${!a.open?'hidden':''}><h3>Kriterien prüfen</h3><p>Vergleiche deine Antwort mit den Kriterien. Markiere, was du erfüllt hast.</p>${q.criteria.map((c,i)=>`<label class="option"><input type="checkbox" data-criterion="${i}" ${a.criteria?.includes(i)?'checked':''}><span>${c}</span></label>`).join('')}<button data-action="assess">Rückmeldung übernehmen</button></div>`}
function feedback(q){if(!done(q))return '';const a=answer(q),r=state.results[q.id];if(q.type==='free')return `<p><strong>Kriterienprüfung</strong></p><ul>${q.criteria.map((c,i)=>`<li class="${a.criteria?.includes(i)?'good':'warn'}">${a.criteria?.includes(i)?'✓':'△'} ${c.replace(/\.$/,'')}${a.criteria?.includes(i)?'':' – noch prüfen'}</li>`).join('')}</ul>`;if(q.type==='choice')return `<p class="${r.score===1?'good':'warn'}"><strong>${r.score===1?'✓ Richtig.':'△ Noch nicht richtig.'}</strong> ${q.explain}</p>`;return `<ul>${q.rows.map((row,i)=>`<li class="${Number(a[i])===row[1]?'good':'warn'}">${Number(a[i])===row[1]?'✓ Richtig.':'△ Noch nicht richtig.'} ${row[0]}<br>${row[2]}</li>`).join('')}</ul>`}
function exercise(q,n){const h=state.hints[q.id]||0;return `<article class="exercise" id="${q.id}" data-id="${q.id}"><span class="eyebrow">Aufgabe ${String(n+1).padStart(2,'0')} · ${q.type==='free'?'Begründen':q.type==='match'?'Zuordnen':'Auswählen'}</span><h3>${q.title}</h3>${q.body}${controls(q)}<div class="actions"><button data-action="check">Prüfen</button><button class="secondary" data-action="hint" ${h===3?'disabled':''}>Hinweis${h?' · '+h+'/3':''}</button><button class="quiet" data-action="retry" ${done(q)?'':'hidden'}>Noch einmal versuchen</button></div><div class="hint" ${h?'':'hidden'}><span class="micro">${['','Denkanstoß','Konkreter Hinweis','Mögliche Aspekte'][h]}</span><p>${h?q.hints[h-1]:''}</p></div>${q.type==='free'?review(q):''}<div class="feedback" role="status" ${done(q)?'':'hidden'}>${feedback(q)}</div></article>`}
function topic(i){const t=topics[i],qs=tasks.filter(q=>q.t===i);return `<div class="sectionhead"><h2>${t.title}</h2><span class="count">Thema ${i+1} / 8</span></div><details class="recap"><summary>Wiederholen</summary><ul>${t.recap.map(x=>`<li>${x}</li>`).join('')}</ul></details>${qs.map(exercise).join('')}${i===6?links():''}<div class="endnav"><button class="secondary" data-view="home">Zur Themenübersicht</button><button data-view="${i===7?'summary':i+1}">${i===7?'Dein Lernstand':'Weiter'}</button></div>`}
function show(v,focus=true){view=v;main.innerHTML=v==='home'?home():v==='summary'?summary():topic(Number(v));document.querySelectorAll('[data-view]').forEach(el=>{if(el.closest('nav'))el.setAttribute('aria-current',el.dataset.view===String(v)?'page':'false')});updateProgress();if(focus){main.focus({preventScroll:true});main.scrollIntoView({behavior:'instant',block:'start'})}}
function invalidate(q,el){delete state.results[q.id];if(q.type==='free'){answer(q).open=false;el.querySelector('.review').hidden=true}el.querySelector('.feedback').hidden=true;el.querySelector('[data-action=retry]').hidden=true;save();updateProgress()}
main.addEventListener('input',e=>{const el=e.target.closest('[data-id]');if(!el)return;const q=tasks.find(q=>q.id===el.dataset.id);if(e.target.dataset.answer!==undefined){state.answers[q.id]??={};state.answers[q.id][e.target.dataset.answer]=e.target.value;invalidate(q,el)}if(e.target.dataset.criterion!==undefined){const a=answer(q);a.criteria=Array.from(el.querySelectorAll('[data-criterion]:checked'),x=>Number(x.dataset.criterion));delete state.results[q.id];el.querySelector('.feedback').hidden=true;save();updateProgress()}});
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){show(nav.dataset.view);return}const btn=e.target.closest('[data-action]');if(!btn)return;const el=btn.closest('[data-id]'),q=tasks.find(q=>q.id===el.dataset.id),a=answer(q),act=btn.dataset.action,fb=el.querySelector('.feedback');if(act==='hint'){const h=Math.min(3,(state.hints[q.id]||0)+1);state.hints[q.id]=h;el.querySelector('.hint').hidden=false;el.querySelector('.hint').innerHTML=`<span class="micro">${['','Denkanstoß','Konkreter Hinweis','Mögliche Aspekte'][h]}</span><p>${q.hints[h-1]}</p>`;btn.textContent=`Hinweis · ${h}/3`;btn.disabled=h===3;save();return}if(act==='retry'){delete state.results[q.id];delete state.answers[q.id];save();const index=tasks.filter(x=>x.t===q.t).findIndex(x=>x.id===q.id);el.outerHTML=exercise(q,index);updateProgress();return}if(act==='check'){const missing=q.type==='free'?!a.text?.trim():q.type==='choice'?a.pick===undefined:q.rows.some((r,i)=>a[i]===undefined||a[i]==='');if(missing){fb.hidden=false;fb.textContent=q.type==='free'?'Formuliere zuerst deine Antwort.':'Wähle zuerst für jede Frage eine Antwort.';return}if(q.type==='free'){a.open=true;el.querySelector('.review').hidden=false;fb.hidden=true;save();return}const score=q.type==='choice'?Number(Number(a.pick)===q.correct):q.rows.filter((r,i)=>Number(a[i])===r[1]).length/q.rows.length;state.results[q.id]={score}}if(act==='assess'){if(!a.text?.trim())return;state.results[q.id]={score:(a.criteria||[]).length/q.criteria.length}}fb.innerHTML=feedback(q);fb.hidden=false;el.querySelector('[data-action=retry]').hidden=false;save();updateProgress()});
document.querySelector('#reset').onclick=()=>{const box=document.querySelector('#resetbox');box.hidden=false;document.querySelector('#cancelReset').focus();box.scrollIntoView({block:'nearest'})};
document.querySelector('#cancelReset').onclick=()=>{document.querySelector('#resetbox').hidden=true;document.querySelector('#reset').focus()};
document.querySelector('#confirmReset').onclick=()=>{state={answers:{},results:{},hints:{}};try{localStorage.removeItem(KEY)}catch(e){}document.querySelector('#resetbox').hidden=true;show('home')};
show('home',false);
</script>
</body>
</html>
